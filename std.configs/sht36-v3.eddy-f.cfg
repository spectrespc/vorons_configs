# External FLY-EDDY with the EDDY-F FPC harness plugged into the EDDY
# connector of the SHT36 V3 / Plus V3 toolboard: hardware I2C on i2c1e,
# LDC1612 at address 42 (the built-in Max V3 chip uses 43 -- see
# sht36-v3.eddy.cfg).  Needs a current Klipper (probe_eddy_current with
# descend_z/rapid_scan).  The physical [probe] must not be loaded together
# with this module: render_profile.py drops std.configs/probe.cfg whenever
# eddy or eddy_f is enabled.

[probe_eddy_current fly_eddy_probe]
sensor_type: ldc1612
i2c_address: 42
i2c_mcu: extruder
i2c_bus: i2c1e
x_offset: 0 # probe position minus nozzle position (Klipper convention)
y_offset: 0 # ditto; measured values live in printers/<profile>/machine-extras.cfg
# descend_z is the trigger gap: probing stops with the nozzle this far above
# the bed, so mount the coil 2-3 mm above the nozzle.  The eddy module has no
# z_offset of its own (z_offset is only the deprecated alias of descend_z, and
# passing both aborts startup with "Option 'z_offset' is not valid");
# PROBE_EDDY_CURRENT_CALIBRATE + SAVE_CONFIG store the calibrate table.
descend_z: 2.5
speed: 10
lift_speed: 15.0
i2c_speed: 4000000
frequency: 40000000 # external FLY-EDDY crystal

[temperature_probe fly_eddy_probe]
sensor_type: Generic 3950
sensor_pin: extruder:gpio28

[force_move]
enable_force_move: true