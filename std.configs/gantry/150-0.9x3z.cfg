[include TMC/3z-tmc2109-17hs4401s.cfg]
[include TMC/xy-tmc5160-17HM19-1684.cfg]

[stepper_x]
##	Connected to X on mcu_xye (B Motor)
step_pin: STEP_0
dir_pin: !DIR_0
enable_pin: !EN_0
rotation_distance: 32
microsteps: 32
full_steps_per_rotation:400
#endstop_pin: extruder:LIMIT_1
endstop_pin: SENS_0
position_min: 0
position_endstop: 153
position_max: 153

##--------------------------------------------------------------------
homing_speed: 150   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

##	Make sure to update below for your relevant driver (2208 or 2209) 17HS19-2004S1
#[tmc2209 stepper_x]
#uart_pin: UART_0
#interpolate: False
#run_current: 1.344
#hold_current: 0.7
#sense_resistor: 0.110
#stealthchop_threshold: 0
#driver_TBL: 0
#driver_TOFF: 3
#driver_HSTRT: 3
#driver_HEND: 3

[stepper_y]
##	Connected to Y on mcu_xye (A Motor)
step_pin: STEP_1
dir_pin: !DIR_1
enable_pin: !EN_1
rotation_distance: 32
microsteps: 32
full_steps_per_rotation:400  #set to 400 for 0.9 degree stepper
endstop_pin: SENS_1
position_min: 0
position_endstop: 156
position_max: 156

##--------------------------------------------------------------------
homing_speed: 150  #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[stepper_z]
step_pin: STEP_2
dir_pin: DIR_2
enable_pin: !EN_2
rotation_distance: 8
microsteps: 32
position_max: 105
position_min: -6
homing_speed: 20
second_homing_speed: 3
homing_retract_dist: 3

[stepper_z1]
step_pin: STEP_3
dir_pin: DIR_3
enable_pin: !EN_3
rotation_distance: 8
microsteps: 32

##	Z MCU - In Z Position
##	Z2 Stepper - Rear Right
[stepper_z2]
step_pin: STEP_4
dir_pin: DIR_4
enable_pin: !EN_4
rotation_distance: 8
microsteps: 32

[resonance_tester]
probe_points: 75, 75, 50

[z_tilt]
z_positions:
   -50, 18
   75, 198
   200, 18
#points:
#   30, 5
#   125, 195
#   220, 5
points:
   15, 45
   75, 135
   135, 45
speed: 600
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075

[bed_mesh]
speed: 600
horizontal_move_z: 5
##--------------------------------------------------------------------

mesh_min: 45, 45
mesh_max: 105,105
##--------------------------------------------------------------------
#fade_start: 1
#fade_end: 10.0
#fade_target: 0
probe_count: 6, 6
algorithm: bicubic
#bicubic_tension: 0.2
#mesh_pps: 5, 5
zero_reference_position: 125, 235
move_check_distance: 3
split_delta_z: 0.0125