# Static Klipper sections shared by every fleet printer.
# This file is rendered first; machine specific pins, mechanics and geometry
# follow, and overrides (anchors.cfg, machine-extras.cfg, local/) come last.

[respond]

[exclude_object]

[pause_resume]

[gcode_arcs]
resolution: 0.1

[virtual_sdcard]
path: ~/printer_data/gcodes

[firmware_retraction]
retract_length: 0
retract_speed: 20
unretract_extra_length: 0
unretract_speed: 10