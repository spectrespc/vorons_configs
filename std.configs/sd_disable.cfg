# Manta M5P SD-card slot power control.
# Klipper silently merges same-named sections, so the previous duplicate
# [static_digital_output disable_SD] blocks collapsed into one and PC1 was
# never driven. Both pins are driven from one section as the safe fallback
# until the two SD slots are confirmed electrically; if they must be
# controlled separately, split this into disable_SD (PC1) and
# disable_SD1 (PC0).
[static_digital_output disable_SD]
pins: PC0, PC1