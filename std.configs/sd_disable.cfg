# Manta M5P SD-card slot power control.
# The two slots must use distinct section names: Klipper silently merges
# same-named sections, so two [static_digital_output disable_SD] blocks
# collapsed into one and PC1 was never driven.
[static_digital_output disable_SD]
pins: PC1

[static_digital_output disable_SD1]
pins: PC0