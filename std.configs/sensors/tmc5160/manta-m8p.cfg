# M8P V2.0: TH2 and TH3 monitor the two TMC5160 X/Y driver heatsinks.
# TH2 is read by the temperature_fan drivers_fan (fans/drivers_hv_fan/), TH3 by
# this standalone sensor.  Klipper does not allow the same ADC pin to be used
# by two temperature objects.  THB is the bed and TH0 the Y-frame thermistor.
[temperature_sensor tmc5160_1]
sensor_type: ATC Semitec 104GT-2
sensor_pin: TH3
min_temp: 0
max_temp: 100
gcode_id: TMC1
