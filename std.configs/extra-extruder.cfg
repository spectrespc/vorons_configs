# >>> tmc_calc.py --update-module: расчёт (блок обновляется автоматически)
# MOONS-CSE14HRA1L410A-01 @ 24 V, Rsense=0.11 Ohm, i_factor=0.6
# Мотор: https://biqu.equipment/products/moons-cse14hra1l410a-01-36-stepper-motor
#   [tmc2209 extruder_stepper ext-extruder]: run_current=0.6 A RMS, CS=19 vsense=1, spreadcycle
# <<< tmc_calc.py: конец блока расчёта
[include boards/ext-sht42-v1.cfg]

[extruder_stepper ext-extruder]
extruder: extruder
#   The extruder this stepper is synchronized to. If this is set to an
#   empty string then the stepper will not be synchronized to an
#   extruder. This parameter must be provided.
step_pin: ext-extruder:EXT_STEP
dir_pin: !ext-extruder:EXT_DIR
enable_pin: !ext-extruder:EXT_EN
#rotation_distance: 22.176 # VZHextrudort, Mini SHerpa and other BMG based extruders #tested ???? 22.889 ????
#rotation_distance: 22.730
#rotation_distance: 22.889
rotation_distance: 22.957
gear_ratio: 50:10
microsteps: 16
#   See the "stepper" section for the definition of the above
#   parameters.


## EXTRUDER MOTOR
[tmc2209 extruder_stepper ext-extruder]
uart_pin: ext-extruder:EXT_UART
#diag_pin: ext-extruder:EXT_DIAG
interpolate: false
#run_current: 0.65
#run_current: 0.672
run_current: 0.60
#run_current: 0.400
#hold_current: 0.1
sense_resistor: 0.110
#stealthchop_threshold: 0
driver_TBL: 0
driver_TOFF: 3
driver_HSTRT: 7
driver_HEND: 5
stealthchop_threshold: 0
