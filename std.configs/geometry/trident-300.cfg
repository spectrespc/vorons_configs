# Trident geometry defaults for a 300 mm bed.
# Bed size dependent numbers only. Measured anchors (z_positions, safe_z_home,
# zero_reference_position, real travel limits) live in the printer profile's
# anchors.cfg and override this file.
[stepper_x]
position_endstop: 300
position_max: 300

[stepper_y]
position_endstop: 300
position_max: 300

[stepper_z]
position_max: 250

[z_tilt]
z_positions:
    -66, 11
    150, 352
    366, 11
points:
    30, 5
    150, 245
    270, 5

[bed_mesh]
speed: 600
horizontal_move_z: 5
mesh_min: 90, 90
mesh_max: 210, 210
probe_count: 9, 9
algorithm: bicubic
zero_reference_position: 150, 150
move_check_distance: 3
split_delta_z: 0.0125

[resonance_tester]
probe_points: 150, 150, 50
