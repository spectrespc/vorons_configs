# Trident geometry defaults for a 200 mm bed.
# Bed size dependent numbers only. Measured anchors (z_positions, safe_z_home,
# zero_reference_position, real travel limits) live in the printer profile's
# anchors.cfg and override this file.
[stepper_x]
position_endstop: 200
position_max: 200

[stepper_y]
position_endstop: 200
position_max: 200

[stepper_z]
position_max: 250

[z_tilt]
z_positions:
    -66, 11
    100, 252
    266, 11
points:
    30, 5
    100, 145
    170, 5

[bed_mesh]
speed: 600
horizontal_move_z: 5
mesh_min: 60, 60
mesh_max: 140, 140
probe_count: 7, 7
algorithm: bicubic
zero_reference_position: 100, 100
move_check_distance: 3
split_delta_z: 0.0125

[resonance_tester]
probe_points: 100, 100, 50
