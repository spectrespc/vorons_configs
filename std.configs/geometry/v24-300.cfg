# Voron 2.4 geometry defaults for a 300 mm bed.
# Bed size dependent numbers only. Measured anchors (gantry_corners,
# safe_z_home, zero_reference_position, real travel limits) live in the printer
# profile's anchors.cfg and override this file.
[stepper_x]
position_endstop: 300
position_max: 300

[stepper_y]
position_endstop: 300
position_max: 300

[stepper_z]
position_max: 290

[quad_gantry_level]
gantry_corners:
    -60, -10
    360, 370
points:
    50, 25
    50, 225
    250, 225
    250, 25

[bed_mesh]
speed: 600
horizontal_move_z: 5
mesh_min: 90, 90
mesh_max: 210, 210
probe_count: 9, 9
algorithm: bicubic
zero_reference_position: 150, 150
move_check_distance: 3
split_delta_z: 0.0125

[resonance_tester]
probe_points: 150, 150, 50
