# Voron 2.4 geometry defaults for a 150 mm bed.
# Bed size dependent numbers only. Measured anchors (gantry_corners,
# safe_z_home, zero_reference_position, real travel limits) live in the printer
# profile's anchors.cfg and override this file.
[stepper_x]
position_endstop: 150
position_max: 150

[stepper_y]
position_endstop: 150
position_max: 150

[stepper_z]
position_max: 140

[quad_gantry_level]
gantry_corners:
    -60, -10
    210, 220
points:
    50, 25
    50, 75
    100, 75
    100, 25

[bed_mesh]
speed: 600
horizontal_move_z: 5
mesh_min: 45, 45
mesh_max: 105, 105
probe_count: 6, 6
algorithm: bicubic
zero_reference_position: 75, 75
move_check_distance: 3
split_delta_z: 0.0125

[resonance_tester]
probe_points: 75, 75, 50
