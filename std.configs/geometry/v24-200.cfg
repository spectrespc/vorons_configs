# Voron 2.4 geometry defaults for a 200 mm bed.
# Bed size dependent numbers only. Measured anchors (gantry_corners,
# safe_z_home, zero_reference_position, real travel limits) live in the printer
# profile's anchors.cfg and override this file.
[stepper_x]
position_endstop: 200
position_max: 200

[stepper_y]
position_endstop: 200
position_max: 200

[stepper_z]
position_max: 190

[quad_gantry_level]
gantry_corners:
    -60, -10
    260, 270
points:
    50, 25
    50, 125
    150, 125
    150, 25

[bed_mesh]
speed: 600
horizontal_move_z: 5
mesh_min: 60, 60
mesh_max: 140, 140
probe_count: 7, 7
algorithm: bicubic
zero_reference_position: 100, 100
move_check_distance: 3
split_delta_z: 0.0125

[resonance_tester]
probe_points: 100, 100, 50
