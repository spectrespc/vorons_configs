# Voron 2.4 geometry defaults for a 250 mm bed.
# Bed size dependent numbers only. Measured anchors (gantry_corners,
# safe_z_home, zero_reference_position, real travel limits) live in the printer
# profile's anchors.cfg and override this file.
[stepper_x]
position_endstop: 250
position_max: 250

[stepper_y]
position_endstop: 250
position_max: 250

[stepper_z]
position_max: 240

[quad_gantry_level]
gantry_corners:
    -60, -10
    310, 320
points:
    50, 25
    50, 175
    200, 175
    200, 25

[bed_mesh]
speed: 600
horizontal_move_z: 5
mesh_min: 75, 75
mesh_max: 175, 175
probe_count: 8, 8
algorithm: bicubic
zero_reference_position: 125, 125
move_check_distance: 3
split_delta_z: 0.0125

[resonance_tester]
probe_points: 125, 125, 50
