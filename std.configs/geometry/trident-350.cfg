# Trident geometry defaults for a 350 mm bed.
# Bed size dependent numbers only. Measured anchors (z_positions, safe_z_home,
# zero_reference_position, real travel limits) live in the printer profile's
# anchors.cfg and override this file.
[stepper_x]
position_endstop: 350
position_max: 350

[stepper_y]
position_endstop: 350
position_max: 350

[stepper_z]
position_max: 250

[z_tilt]
z_positions:
    -66, 11
    175, 402
    416, 11
points:
    30, 5
    175, 295
    320, 5

[bed_mesh]
speed: 600
horizontal_move_z: 5
mesh_min: 105, 105
mesh_max: 245, 245
probe_count: 10, 10
algorithm: bicubic
zero_reference_position: 175, 175
move_check_distance: 3
split_delta_z: 0.0125

[resonance_tester]
probe_points: 175, 175, 50
