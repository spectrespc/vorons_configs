# Voron 2.4 geometry defaults for a 350 mm bed.
# Bed size dependent numbers only. Measured anchors (gantry_corners,
# safe_z_home, zero_reference_position, real travel limits) live in the printer
# profile's anchors.cfg and override this file.
[stepper_x]
position_endstop: 350
position_max: 350

[stepper_y]
position_endstop: 350
position_max: 350

[stepper_z]
position_max: 340

[quad_gantry_level]
gantry_corners:
    -60, -10
    410, 420
points:
    50, 25
    50, 275
    300, 275
    300, 25

[bed_mesh]
speed: 600
horizontal_move_z: 5
mesh_min: 105, 105
mesh_max: 245, 245
probe_count: 10, 10
algorithm: bicubic
zero_reference_position: 175, 175
move_check_distance: 3
split_delta_z: 0.0125

[resonance_tester]
probe_points: 175, 175, 50
