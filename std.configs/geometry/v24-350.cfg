# Voron 2.4 geometry defaults for a 350 mm bed.
# Bed size dependent numbers only. Measured anchors (gantry_corners,
# safe_z_home, zero_reference_position, real travel limits) live in the printer
# profile's anchors.cfg and override this file.
[stepper_x]
position_endstop: 350
position_max: 350

[stepper_y]
position_endstop: 350
position_max: 350

[stepper_z]
position_max: 340

# v24 rule: G28 lifts the gantry 30 mm before homing X/Y, so a low or
# tilted gantry cannot drag the nozzle across the bed.  safe_z_home also
# homes Z with the probe at the bed centre.  anchors.cfg overrides this.
[safe_z_home]
home_xy_position: 175, 175
speed: 100.0
z_hop: 30
z_hop_speed: 30.0

[quad_gantry_level]
gantry_corners:
    -60, -10
    410, 420
points:
    50, 25
    50, 275
    300, 275
    300, 25

[bed_mesh]
speed: 600
horizontal_move_z: 5
# Size-dependent default without any probe offset knowledge: a catalog 0.3*S
# margin (105 = 0.3*350) covering 140x140 mm.  A machine with a real probe
# offset overrides mesh_min/mesh_max/probe_count in its anchors.cfg, because the
# reachable area then depends on the offset and the coil margin:
#   mesh_min = max(position_min + offset + 2, edge)
#   mesh_max = min(position_max + offset, bed - edge)
mesh_min: 105, 105
mesh_max: 245, 245
probe_count: 10, 10
algorithm: bicubic
zero_reference_position: 175, 175
move_check_distance: 3
split_delta_z: 0.0125

[resonance_tester]
probe_points: 175, 175, 50
