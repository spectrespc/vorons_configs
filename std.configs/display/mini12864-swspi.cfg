##	mini12864 on the BigTreeTech Manta M8P v1.x EXP header
#
# display/mini12864.cfg selects the hardware bus "spi2".  That is correct on the
# M5P and the M8P V2.0, but not on the v1.x family: EXP2_6 (MOSI) is PB11, which
# is SPI1_MOSI on the STM32G0B1, while the spi2 pins (PB13/PB14/PB15) are not
# routed to the EXP2 header.
#
# Klipper merges same-named sections (RawConfigParser strict=False) and the last
# value wins, so this file is included after display/mini12864.cfg and only for
# board=manta-m8p-v1.0 / manta-m8p-v1.1.  The software SPI pins follow the Voron
# v1 reference: sclk EXP2_2, miso EXP2_1, mosi EXP2_6.  When the spi_software_*
# pins are present Klipper ignores spi_bus entirely; it is set to "none" here to
# make the intent explicit.
[display]
spi_bus: none
spi_software_sclk_pin: EXP2_2
spi_software_miso_pin: EXP2_1
spi_software_mosi_pin: EXP2_6