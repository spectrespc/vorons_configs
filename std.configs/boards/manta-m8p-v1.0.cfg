# BIGTREETECH Manta M8P V1.0 (STM32G0B1VET6, 8 KiB bootloader, 8 MHz crystal).
# Aliases follow the same naming convention as boards/manta-m8p.cfg (V2.0) and
# boards/manta-m5p.cfg so every shared mechanic/motor/fan module works here too.
#
# V1.0 and V1.1 differ only at MOTOR6..MOTOR8 (see the stepper block).  V1.0 has
# no CAN transceiver and must talk to the host over USB.  The MCU and CAN UUIDs
# live in printers/<profile>/local/uuids.cfg, never here.
#
# Driver -> motor -> axis map used by the Voron 2.4 (4Z) mechanic:
#   MOTOR1 = X  -> STEP_0/.../SENS_0
#   MOTOR2 = Y  -> STEP_1/.../SENS_1
#   MOTOR3 = Z0 -> STEP_2/...
#   MOTOR4 = spare             (its M4-STOP input is the probe pin below)
#   MOTOR5 = Z1 -> STEP_4/...
#   MOTOR6 = Z2 -> STEP_5/...
#   MOTOR7 = Z3 -> STEP_6/...
#   MOTOR8 = E  -> STEP_7/...   (direct-wired extruder; CAN toolheads use
#                                boards/sht36-v3.cfg or boards/ext-sht42-v1.cfg)
#
# Reference: VoronDesign/Voron-2 firmware/klipper_configurations/M8P/
# Voron2_M8P-v1.0_config.cfg and Klipper
# config/generic-bigtreetech-manta-m8p-v1.0.cfg.  This board module has not
# been validated on physical hardware yet (see README "Known limitations").
[board_pins]
aliases:
    # --- EXP1 header ---
    EXP1_1=PE9, EXP1_2=PE10,
    EXP1_3=PE11, EXP1_4=PE12,
    EXP1_5=PE13, EXP1_6=PE14,    # slot in the socket on this side
    EXP1_7=PE15, EXP1_8=PB10,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # --- EXP2 header ---
    EXP2_1=PB14, EXP2_2=PB13,
    EXP2_3=PF7, EXP2_4=PB12,
    EXP2_5=PE7, EXP2_6=PB11,     # slot in the socket on this side
    EXP2_7=PE8, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<NC>,
    # EXP2_10: the Klipper reference marks it <NC>, the Voron reference writes
    # PC5.  No module uses it, so the Klipper/MCU reading is kept.
    # EXP2_6 (PB11) is SPI1_MOSI, not the hardware spi2 MOSI, which is why the
    # v1.x display uses display/mini12864-swspi.cfg.

    # --- Stepper drivers, MOTOR1..MOTOR8 ---
    STEP_0=PE2,  DIR_0=PB4,  EN_0=PC11, UART_0=PC10, DIAG_0=PF3,
    STEP_1=PF12, DIR_1=PF11, EN_1=PB3,  UART_1=PF13, DIAG_1=PF4,
    STEP_2=PD7,  DIR_2=PD6,  EN_2=PF10, UART_2=PF9,  DIAG_2=PF5,
    STEP_3=PD3,  DIR_3=PD2,  EN_3=PD5,  UART_3=PD4,  DIAG_3=PC0,
    STEP_4=PC9,  DIR_4=PC8,  EN_4=PD1,  UART_4=PD0,
    # V1.0 only: V1.1 moved MOTOR6..MOTOR8 (and freed PD12/PD13 for CAN).
    STEP_5=PA10, DIR_5=PD15, EN_5=PA15, UART_5=PF8,
    STEP_6=PD12, DIR_6=PD11, EN_6=PD14, UART_6=PD13,
    STEP_7=PD10, DIR_7=PD8,  EN_7=PD9,  UART_7=PC7,

    # --- Endstops / sensors ---
    # Only MOTOR1..MOTOR4 expose a documented STOP input; the stop inputs of
    # MOTOR5..MOTOR8 are not documented and no module uses them.
    SENS_0=PF3,   # X stop (MOTOR1)
    SENS_1=PF4,   # Y stop (MOTOR2)
    SENS_2=PF5,   # Z stop (MOTOR3)
    SENS_3=PC0,   # MOTOR4 stop; wired as the probe input here

    # --- Heaters ---
    # Fleet v24 wiring drives the bed SSR from the FAN0 header (see
    # bed/manta-m8p.cfg); HEAT_HB is the dedicated bed output and stays unused
    # unless a machine overrides [heater_bed] heater_pin in machine-extras.cfg.
    HEAT_HB=PB7,
    HEAT_HE0=PE3,
    HEAT_HE1=PB5,
    HEAT_HE2=PB6,
    HEAT_HE3=PE1,

    # --- Thermistors ---
    THB=PA0, TH0=PA1, TH1=PA2, TH2=PA3, TH3=PA4,

    # --- Fans ---
    FAN_0=PE6, FAN_1=PE0, FAN_2=PC12, FAN_3=PE5,
    FAN_4=PE4, FAN_5=PB8, FAN_6=PB9,

    # Onboard TMC5160 (MOTOR1/MOTOR2) share SPI1 on PA5/PA6/PA7; their CS pins
    # are UART_0/UART_1.  The fleet TMC5160 modules drive this bus as software
    # SPI, so only these three aliases are needed.
    TMC_SCLK=PA5, TMC_MOSI=PA7, TMC_MISO=PA6,

    # --- Misc ---
    RGB_0=PC6, RGB_1=PA9,
    PROBE_0=PF6,     # onboard proximity input
    BLT_CONT=PB1,    # BLTouch control
    BLT_SENS=PB2,    # BLTouch sensor
    PS_ON=PC3

# Probe input on the M8P V1.x: M4-STOP / PC0.  Check the NPN/PNP jumper of the
# probe input before commissioning; the inversion follows the V2.0 convention.
[probe]
pin: !PC0