# BIGTREETECH Manta M8P V2.0 (STM32H723, 128 KiB bootloader, 25 MHz crystal).
# Aliases follow the same naming convention as boards/manta-m5p.cfg so every
# shared mechanic/motor/fan module works on both boards.
#
# MCU and CAN UUIDs live in printers/<profile>/local/uuids.cfg, never here.
#
# Driver -> motor -> axis map used by the Voron 2.4 (4Z) mechanic:
#   MOTOR1 = X  -> STEP_0/.../SENS_0
#   MOTOR2 = Y  -> STEP_1/.../SENS_1
#   MOTOR3 = Z0 -> STEP_2/...   (front left)
#   MOTOR4 = spare             (second extruder, MMU, ...)
#   MOTOR5 = Z1 -> STEP_4/...   (rear left)
#   MOTOR6 = Z2 -> STEP_5/...   (rear right)
#   MOTOR7 = Z3 -> STEP_6/...   (front right)
#   MOTOR8 = E  -> STEP_7/...   (direct-wired extruder; CAN toolheads use
#                                boards/sht36-v3.cfg or boards/ext-sht42-v1.cfg)
#
# Reference: VoronDesign/Voron-2 firmware/klipper_configurations/M8P/
# Voron2_M8P-v2.0_config.cfg. This board module has not been validated on
# physical hardware yet (see README "Known limitations").
[board_pins]
aliases:
    # --- EXP1 header ---
    EXP1_1=PE7, EXP1_2=PG1,
    EXP1_3=PG0, EXP1_4=PF15,
    EXP1_5=PF14, EXP1_6=PF13,    # slot in the socket on this side
    EXP1_7=PF12, EXP1_8=PF11,
    EXP1_9=<GND>, EXP1_10=<5V>,
    # --- EXP2 header ---
    EXP2_1=PE13, EXP2_2=PE12,
    EXP2_3=PE15, EXP2_4=PE11,
    EXP2_5=PE10, EXP2_6=PE14,    # slot in the socket on this side
    EXP2_7=PE8, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<NC>,

    # --- Stepper drivers, MOTOR1..MOTOR8 ---
    STEP_0=PE6,  DIR_0=PE5,  EN_0=PC14, UART_0=PC13, DIAG_0=PF4,
    STEP_1=PE2,  DIR_1=PE1,  EN_1=PE4,  UART_1=PE3,  DIAG_1=PF3,
    STEP_2=PB8,  DIR_2=PB7,  EN_2=PE0,  UART_2=PB9,  DIAG_2=PF2,
    STEP_3=PB4,  DIR_3=PB3,  EN_3=PB6,  UART_3=PB5,  DIAG_3=PF1,
    STEP_4=PG13, DIR_4=PG12, EN_4=PG15, UART_4=PG14,
    STEP_5=PG9,  DIR_5=PD7,  EN_5=PG11, UART_5=PG10,
    STEP_6=PD4,  DIR_6=PD3,  EN_6=PD6,  UART_6=PD5,
    STEP_7=PC7,  DIR_7=PC8,  EN_7=PD2,  UART_7=PC6,

    # --- Endstops / sensors ---
    SENS_0=PF4,   # X stop (MOTOR1)
    SENS_1=PF3,   # Y stop (MOTOR2)
    SENS_2=PF2,   # Z stop (MOTOR3)
    SENS_3=PF1,   # MOTOR4 stop
    SENS_4=PF0,   # MOTOR5 stop

    # --- Heaters ---
    HEAT_HEB=PA1,  # bed SSR, HE1 connector
    HEAT_HE0=PA0,
    HEAT_HE1=PA3,
    HEAT_HE2=PA5,

    # --- Thermistors ---
    THB=PB1, TH0=PB0, TH1=PC5, TH2=PC4, TH3=PA7,

    # --- Fans ---
    FAN_0=PF7, FAN_1=PF9, FAN_2=PF6, FAN_3=PF8,
    FAN_4=PA4, FAN_5=PA6, FAN_6=PA2,

    # --- Misc ---
    RGB_0=PD15,
    PROBE_0=PD8,     # onboard proximity input
    BLT_CONT=PD12,   # BLTouch control
BLT_SENS=PD13,   # BLTouch sensor
PS_ON=PD14

# Probe input on the M8P V2.0: M4-STOP / PF1 (Voron2_M8P-v2.0 reference).
[probe]
pin: !PF1