[include ../pinout/sht36-v3.cfg]
[include ../stealthburner_leds.cfg]
[include tc/pt1000.cfg]
#[include tc/104-gt2.cfg]
[include extruder/HGX.8T.cfg]


[extruder]
pwm_cycle_time: 0.02
smooth_time: 0.5
pressure_advance: 0.01
pressure_advance_smooth_time: 0.010
heater_pin: extruder:HE0
control = pid # Sample PID - perform your own PID tuning for accurate results.
min_temp: 0
max_temp: 310
min_extrude_temp: 160

[verify_heater extruder]
max_error: 20
check_gain_time:120
hysteresis: 50
heating_gain: 2

# moons 
# 1A
# 1,9V
# 1,41H
# 1.9 Ohm

## EXTRUDER MOTOR
[tmc2209 extruder]
uart_pin: extruder:EXT_UART
#diag_pin: extruder:EXT_DIAG
interpolate: false
#run_current: 0.65
#run_current: 0.672
run_current: 0.55
#run_current: 0.400
#hold_current: 0.1
sense_resistor: 0.110
#stealthchop_threshold: 0
driver_TBL: 0
driver_TOFF: 3
driver_HSTRT: 7
driver_HEND: 6

[fan]
pin: extruder:FAN1
kick_start_time: 0
cycle_time: 0.15
off_below: 0

[heater_fan hotend_fan]
pin: extruder:FAN0
max_power: 1.0
fan_speed: 1.0
kick_start_time: 0
heater: extruder
heater_temp: 50.0

#[heater_fan 4W_FAN0]
#pin: extruder: 4W_FAN0
#tachometer_pin: extruder: TAH0
#tachometer_ppr: 1

