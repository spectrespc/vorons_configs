[lis2dw]
cs_pin: extruder: ADXL
#spi_bus: spi2
spi_software_sclk_pin: extruder: SCLK1
spi_software_mosi_pin: extruder: MOSI1
spi_software_miso_pin: extruder: MISO1
# Ориентация чипа на sht36-v3: ось X чипа вертикальна. Проверено 2026-11-23 на
# v24-350: ACCELEROMETER_QUERY даёт z=+9475 (вертикаль на Z), ход +X даёт
# отклик только в x, ход +Y — только в y. Прежнее значение x,z,-y вешало
# вертикаль на ось X принтера и портило замер резонансов по X.
axes_map: -y,z,-x

[resonance_tester]
accel_chip: lis2dw
min_freq: 5
max_freq: 133
accel_per_hz: 75
hz_per_sec: 1