[probe]
# The pin is an alias from [board_pins] of the board file: every Manta board in
# the fleet defines SENS_2 (M3-STOP, the connector labelled "Z stop").
# It lives here and not in the board files on purpose: machines that probe with
# an eddy current sensor (features eddy/eddy_f, [probe_eddy_current]) drop this
# file, and a pin left in the always-included board file would register a second
# 'probe' object - Klipper refuses to start on "Registering duplicate object".
pin: !SENS_2
x_offset: 0
y_offset: 0
## z_offset - больше минус - ниже сопло
## Дефолтное значение:
##z_offset: -0.560 
z_offset: -0.400
#speed: 15.0
speed: 3.0
samples: 5
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.01
samples_tolerance_retries: 5
activate_gcode:
    {% set PROBE_TEMP = 150 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}

    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M106 S256
        M109 S{ PROBE_TEMP }
        M106 S0
    {% else %}
        # Temperature target is already low enough, but nozzle may still be too hot.
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
    {% endif %}
