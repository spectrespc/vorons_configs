#   [tmc5160 stepper_x]: run_current=1.9799 A RMS, GLOBALSCALER=165 IRUN=31, spreadcycle
#   [tmc5160 stepper_y]: run_current=1.9799 A RMS, GLOBALSCALER=165 IRUN=31, spreadcycle
