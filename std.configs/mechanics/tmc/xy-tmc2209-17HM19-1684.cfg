# XY drivers on the Manta M8P V2.0 reference build (TMC2209, UART mode).
# Motor currents are machine specific: override in anchors.cfg or local/.
[tmc2209 stepper_x]
uart_pin: UART_0
interpolate: false
run_current: 0.800
sense_resistor: 0.110
stealthchop_threshold: 0

[tmc2209 stepper_y]
uart_pin: UART_1
interpolate: false
run_current: 0.800
sense_resistor: 0.110
stealthchop_threshold: 0