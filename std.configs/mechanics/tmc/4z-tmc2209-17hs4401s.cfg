# <<< tmc_calc.py: конец блока расчёта
# Four Z drivers on the Manta M8P V2.0 reference build (TMC2209, UART mode).
# Z0 = MOTOR3, Z1 = MOTOR5, Z2 = MOTOR6, Z3 = MOTOR7.
# The slot layout is a machine property: a printer wired differently (e.g.
# Z0..Z3 in MOTOR3..MOTOR6) overrides [stepper_z*] and these uart_pin values in
# its profile machine-extras.cfg.
# Motor currents are machine specific: override in anchors.cfg or local/.
[tmc2209 stepper_z]
uart_pin: UART_2
interpolate: false
run_current: 1.7
sense_resistor: 0.110
stealthchop_threshold: 0
driver_TBL: 0
driver_TOFF: 3
driver_HSTRT: 0
driver_HEND: 2

[tmc2209 stepper_z1]
uart_pin: UART_4
interpolate: false
run_current: 1.7
sense_resistor: 0.110
stealthchop_threshold: 0
driver_TBL: 0
driver_TOFF: 3
driver_HSTRT: 0
driver_HEND: 2

[tmc2209 stepper_z2]
uart_pin: UART_5
interpolate: false
run_current: 1.7
sense_resistor: 0.110
stealthchop_threshold: 0
driver_TBL: 0
driver_TOFF: 3
driver_HSTRT: 0
driver_HEND: 2

[tmc2209 stepper_z3]
uart_pin: UART_6
interpolate: false
run_current: 1.7
sense_resistor: 0.110
