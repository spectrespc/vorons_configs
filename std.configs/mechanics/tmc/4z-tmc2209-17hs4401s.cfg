# Four Z drivers on the Manta M8P V2.0 reference build (TMC2209, UART mode).
# Z0 = MOTOR3, Z1 = MOTOR5, Z2 = MOTOR6, Z3 = MOTOR7.
# Motor currents are machine specific: override in anchors.cfg or local/.
[tmc2209 stepper_z]
uart_pin: UART_2
interpolate: false
run_current: 0.600
sense_resistor: 0.110
stealthchop_threshold: 999999

[tmc2209 stepper_z1]
uart_pin: UART_4
interpolate: false
run_current: 0.600
sense_resistor: 0.110
stealthchop_threshold: 999999

[tmc2209 stepper_z2]
uart_pin: UART_5
interpolate: false
run_current: 0.600
sense_resistor: 0.110
stealthchop_threshold: 999999

[tmc2209 stepper_z3]
uart_pin: UART_6
interpolate: false
run_current: 0.600
sense_resistor: 0.110
stealthchop_threshold: 999999