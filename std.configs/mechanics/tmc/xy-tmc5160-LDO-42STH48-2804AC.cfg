# Voron 2.4 X/Y motors: LDO-42STH48-2804AC (1.8 deg, 55 Ncm, 2.8 A/phase).
# TMC5160 in SPI mode with the fleet settings for this motor.
[tmc5160 stepper_x]
cs_pin: UART_0
interpolate: False
diag1_pin: DIAG_0
sense_resistor: 0.075
run_current: 1.697
stealthchop_threshold: 0
spi_bus: spi2
spi_speed: 1000000
driver_TBL: 0
driver_TOFF: 3
driver_HSTRT: 7
driver_HEND: 8
driver_FD3: 1
driver_TPFD: 2

[tmc5160 stepper_y]
cs_pin: UART_1
interpolate: False
#diag1_pin: DIAG_1
sense_resistor: 0.075
run_current: 1.697
stealthchop_threshold: 0
spi_bus: spi2
spi_speed: 1000000
driver_TBL: 0
driver_TOFF: 3
driver_HSTRT: 7
driver_HEND: 8
driver_FD3: 1
driver_TPFD: 2
