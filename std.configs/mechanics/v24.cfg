# Voron 2.4 mechanic: CoreXY frame, four Z belts driven by
# QUAD_GANTRY_LEVEL. Based on the official Voron2_M8P-v2.0 reference config.
# Hardware facts only; size dependent limits live in geometry/, measured
# anchors in printers/<profile>/anchors.cfg.
[include tmc/xy-tmc2209-17HM19-1684.cfg]
[include tmc/4z-tmc2209-17hs4401s.cfg]

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 350
square_corner_velocity: 5.0

[stepper_x]
step_pin: STEP_0
dir_pin: !DIR_0
enable_pin: !EN_0
rotation_distance: 32
microsteps: 32
endstop_pin: SENS_0
position_min: 0
homing_speed: 25
homing_retract_dist: 5
homing_positive_dir: true

[stepper_y]
step_pin: STEP_1
dir_pin: !DIR_1
enable_pin: !EN_1
rotation_distance: 32
microsteps: 32
endstop_pin: SENS_1
position_min: 0
homing_speed: 25
homing_retract_dist: 5
homing_positive_dir: true

# Z0 front left, Z1 rear left, Z2 rear right, Z3 front right.
[stepper_z]
step_pin: STEP_2
dir_pin: DIR_2
enable_pin: !EN_2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
endstop_pin: probe:z_virtual_endstop
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[stepper_z1]
step_pin: STEP_4
dir_pin: !DIR_4
enable_pin: !EN_4
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[stepper_z2]
step_pin: STEP_5
dir_pin: DIR_5
enable_pin: !EN_5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[stepper_z3]
step_pin: STEP_6
dir_pin: !DIR_6
enable_pin: !EN_6
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

# Coordinates (gantry_corners, points) are supplied by geometry/ and may be
# overridden by printers/<profile>/anchors.cfg.
[quad_gantry_level]
speed: 100
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
max_adjust: 10