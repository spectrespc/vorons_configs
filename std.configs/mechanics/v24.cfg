# Voron 2.4 mechanic: CoreXY frame, four Z belts driven by
# QUAD_GANTRY_LEVEL. Based on the official Voron2_M8P-v2.0 reference config.
# Hardware facts only; size dependent limits live in geometry/, measured
# anchors in printers/<profile>/anchors.cfg. The Z driver module is chosen by
# machine.conf and included from profile.cfg, not here.

[printer]
kinematics: corexy
# 750 / 8500 is the measured recommendation for the default 64 X/Y microsteps:
# bench v24-350 (2026-11-22) stayed within one full step up to 900 mm/s and
# 10000 mm/s^2, and the table applies ~15 % margin.  Per-microstep envelope:
# printers/v24-350/machine-extras.cfg.
max_velocity: 750
max_accel: 8500
max_z_velocity: 15
max_z_accel: 350
square_corner_velocity: 5.0

[stepper_x]
step_pin: STEP_0
dir_pin: !DIR_0
enable_pin: !EN_0
# GT2 belt, 20T pulley: 20 * 2 mm = 40 mm per revolution.
rotation_distance: 40
# X/Y default to 64 microsteps: on the v24-350 bench (2026-11-22) 32 lost
# ~0.8 mm on the A motor inside TEST_SPEED 700-900 mm/s x 3000-10000 mm/s^2,
# while 64 never exceeded one full step.  One full step stays 0.2 mm (320
# steps/mm here); Z keeps its 16.  Measured envelope per microstep:
# printers/v24-350/machine-extras.cfg.
# TEST 2026-11-23: 128 for the +50 % series; revert to 64 after the run.
microsteps: 128
endstop_pin: SENS_0
position_min: 0
homing_speed: 50
homing_retract_dist: 5
homing_positive_dir: true

[stepper_y]
step_pin: STEP_1
dir_pin: !DIR_1
enable_pin: !EN_1
# GT2 belt, 20T pulley: 20 * 2 mm = 40 mm per revolution.
rotation_distance: 40
# Same 64 microsteps as stepper_x (see the note there).
# TEST 2026-11-23: 128 for the +50 % series; revert to 64 after the run.
microsteps: 128
endstop_pin: SENS_1
position_min: 0
homing_speed: 50
homing_retract_dist: 5
homing_positive_dir: true

# Z0 front left, Z1 rear left, Z2 rear right, Z3 front right.
[stepper_z]
step_pin: STEP_2
dir_pin: DIR_2
enable_pin: !EN_2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
endstop_pin: probe:z_virtual_endstop
position_min: -5
homing_speed: 16
second_homing_speed: 6
homing_retract_dist: 3

[stepper_z1]
step_pin: STEP_4
dir_pin: !DIR_4
enable_pin: !EN_4
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[stepper_z2]
step_pin: STEP_5
dir_pin: DIR_5
enable_pin: !EN_5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[stepper_z3]
step_pin: STEP_6
dir_pin: !DIR_6
enable_pin: !EN_6
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

# Coordinates (gantry_corners, points) are supplied by geometry/ and may be
# overridden by printers/<profile>/anchors.cfg.
#
# These values belong to the fine (eddy scan) pass of the QUAD_GANTRY_LEVEL
# wrapper in std.macros/homing.cfg: the scan is repeatable enough for 0.015 mm.
# The rough pass before it overrides RETRY_TOLERANCE/RETRIES on the command
# line.  horizontal_move_z stays 10 mm as the safety reserve of the rough
# descend pass, and max_adjust stays the mechanism that recovers a sagged rear
# gantry corner.
[quad_gantry_level]
speed: 200
horizontal_move_z: 10
retries: 3
retry_tolerance: 0.015
max_adjust: 10