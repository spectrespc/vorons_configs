# Trident mechanic: CoreXY frame, three Z leadscrews driven by Z_TILT.
# Hardware facts only: pins, belt/leadscrew ratios, homing behaviour and the
# [printer] envelope. Bed size dependent limits live in geometry/, measured
# anchor points in printers/<profile>/anchors.cfg.
[include tmc/3z-tmc2109-17hs4401s.cfg]
[include tmc/xy-tmc5160-17HM19-1684.cfg]

[printer]
kinematics: corexy
max_velocity: 700
max_accel: 10000
max_z_velocity: 15
max_z_accel: 300
square_corner_velocity: 5.0

[stepper_x]
step_pin: STEP_0
dir_pin: !DIR_0
enable_pin: !EN_0
rotation_distance: 32
microsteps: 32
endstop_pin: SENS_0
position_min: 0
homing_speed: 150
homing_retract_dist: 5
homing_positive_dir: true

[stepper_y]
step_pin: STEP_1
dir_pin: !DIR_1
enable_pin: !EN_1
rotation_distance: 32
microsteps: 32
endstop_pin: SENS_1
position_min: 0
homing_speed: 150
homing_retract_dist: 5
homing_positive_dir: true

[stepper_z]
step_pin: STEP_2
dir_pin: DIR_2
enable_pin: !EN_2
rotation_distance: 8
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_min: -6
homing_speed: 20
second_homing_speed: 3
homing_retract_dist: 3

# Z1 and Z2 are the remaining leadscrews of the three-point bed.
[stepper_z1]
step_pin: STEP_3
dir_pin: DIR_3
enable_pin: !EN_3
rotation_distance: 8
microsteps: 32

[stepper_z2]
step_pin: STEP_4
dir_pin: DIR_4
enable_pin: !EN_4
rotation_distance: 8
microsteps: 32

# Coordinates (z_positions, points) are supplied by geometry/ and overridden
# with measured values by printers/<profile>/anchors.cfg.
[z_tilt]
speed: 600
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075