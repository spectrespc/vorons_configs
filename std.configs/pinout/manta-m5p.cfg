[board_pins]
aliases:
    # BTT OCTO PRO 1.0
    # EXP1 header
    EXP1_1=PD5, EXP1_3=PB3, EXP1_5=PB5, EXP1_7=PB7, EXP1_9=<GND>,
    EXP1_2=PD4,  EXP1_4=PD6, EXP1_6=PB4, EXP1_8=PB6, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=PB14, EXP2_3=PB8, EXP2_5=PC10, EXP2_7=PC12,  EXP2_9=<GND>,
    EXP2_2=PB13, EXP2_4=PB9, EXP2_6=PB15, EXP2_8=<RST>, EXP2_10=<NC>,
    # Pins EXP2_1, EXP2_6, EXP2_2 are also MISO, MOSI, SCK of bus "spi2"
    # Stepper 0
    STEP_0=PC8,
    DIR_0=PC9,
    EN_0=PA15,
    UART_0=PD9,
    DIAG_0=PD3,
    # Stepper 1
    STEP_1=PA10,
    DIR_1=PA14,
    EN_1=PA13,
    UART_1=PD8,
    DIAG_1=PD2,
    # Stepper 2
    STEP_2=PC6,
    DIR_2=PC7,
    EN_2=PA9,
    UART_2=PB10,
    DIAG_2=PC3,
    # Stepper 3
    STEP_3=PB12,
    DIR_3=PB11,
    EN_3=PA8,
    UART_3=PB2,
    DIAG_3=PC2,
    # Stepper 4
    STEP_4=PB0,
    DIR_4=PB1,
    EN_4=PC4,
    UART_4=PA6,
    #DIAG_4=,
	#Endstop
	SENS_0=PD3,
	SENS_1=PD2,
	SENS_2=PC3,
	SENS_3=PC2,
    #Heats
	HEAT_HEB=PA5,
    HEAT_HE0=PC5,
    HEAT_HE1=PA7,
    #Temp sensors
    THB=PA0,
    TH0=PA1,
    TH1=PA2,
    #Fans
    FAN_0=PA4,
    FAN_1=PA3,
	#OTHER
	RGB_0=PC11,
    RGB_1=PC14,
	BLT_CONT=PC13,
	PROBE_0=PC15,
	PWR_DET=PC0,
    PS_ON=PE11

	