# This file contains common pin mappings for the BIGTREETECH ex-extruder
# Canbus board. To use this config, the firmware should be compiled for the
#stm32f072
#8KiB bootloader
#CAN bus PB8(CAN-RX) PB9(CAN-TX)
#CAN bus speed 1000000
# See docs/Config_Reference.md for a description of parameters.
#
#                                    
#                                    
#                               
#                       ----------            
#             -y       |          |              
#              ^       |          |           
#              |        ----------                     
#              |       *                    
#    +x <------*        
#              |    
#              |    
#             +y        x,z,-y
#                   
#
[board_pins ext-extruder]
mcu: ext-extruder
aliases:
aliases_2209:
    EXT_EN=PA15, EXT_STEP=PB4, EXT_DIR=PB3, EXT_UART=PB5
aliases_endstop:
    LIMIT_0=PA0, LIMIT_1=PA1, LIMIT_2=PA2
aliases_probe: 
    PROBE_0=PB2, PROBE_1=PC15
aliases_cnc_fans:
    FAN0=PB10, FAN1=PB11
aliases_thermistors:
    TH0=PB0
aliases_heaters:
    HE0=PA8
aliases_rgb:
    RGBLED=PB15
aliases_blt:
    BLT_C=PB1

[temperature_sensor ext-extruder]
sensor_type: temperature_mcu
sensor_mcu: ext-extruder
max_temp: 82