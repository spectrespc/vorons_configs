## SB2040 BOARD PINS
[board_pins SB2040]
mcu: SB2040
aliases:
aliases_2209:
    EXT_EN=gpio7,EXT_STEP=gpio9,EXT_DIR=gpio10,EXT_UART=gpio8
aliases_endstop:
    LIMIT_0=gpio25,LIMIT_1=gpio28,LIMIT_2=gpio29
aliases_cnc_fans:
    FAN0=gpio13,FAN1=gpio14,FAN2=gpio15
aliases_thermistors:
    TH0=gpio27,TH1=gpio26
aliases_heaters:
    HE0=gpio6
aliases_rgb:
    RGBLED=gpio12
aliases_adxl:
    ADXL=gpio1

[mcu SB2040]
canbus_uuid: 6ca337bd2755

#[temperature_sensor SB2040]
#sensor_type: temperature_mcu
#sensor_mcu: SB2040

[temperature_sensor SB2040_NTC]
sensor_type: Generic 3950
sensor_pin: SB2040:TH1

[temperature_fan SB2040_temperature]
sensor_type: temperature_mcu #This is what the Pi3's Temperature sensor is known as.
sensor_mcu: SB2040
pin: SB2040:FAN2                  #Set this to your fan pin
max_temp: 80.0                #Set below 85C, Pi3+ MCU can be damaged at 85C
target_temp: 49.0             #Set this to your preferred running temperature
min_temp: 0
shutdown_speed: 0.0
kick_start_time: 0.5
off_below: 0.19
max_speed: 1.0
min_speed: 0.0
control: pid
pid_Kp: 2.0
pid_Ki: 5.0
pid_Kd: 0.5
pid_deriv_time: 2.0

[heater_fan hotend_fan]
pin: SB2040:FAN1
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

[fan]
pin: SB2040:FAN0
kick_start_time: 0.15
cycle_time: 0.15
off_below: 0.05

[extruder]
step_pin: SB2040:EXT_STEP
dir_pin: !SB2040:EXT_DIR
enable_pin: !SB2040:EXT_EN
rotation_distance: 22.67895 # VZHextrudort, Mini SHerpa and other BMG based extruders
gear_ratio: 50:8 
microsteps: 16
full_steps_per_rotation: 200
max_extrude_only_distance: 2000.0
max_extrude_only_velocity: 50.0
max_extrude_only_accel: 1500
nozzle_diameter: 0.400
filament_diameter: 1.750
pwm_cycle_time: 0.02
#smooth_time: 0.5
smooth_time: 1
max_power: 0.8
heater_pin: SB2040:HE0
sensor_pin: SB2040:TH0
sensor_type: PT1000
#sensor_type: ATC Semitec 104GT-2  # this is the default for the Revo heater
#pullup_resistor: 1000
#pullup_resistor: 2200             # Uncomment for PT100 Sensor with jumper installed. 
control = pid # Sample PID - perform your own PID tuning for accurate results. 
#PID parameters: pid_Kp=16.770 pid_Ki=1.215 pid_Kd=57.856
pid_kp = 16.770
pid_ki = 1.215
pid_kd = 57.856
min_temp: 0
max_temp: 285
min_extrude_temp: 160

[tmc2209 extruder]
uart_pin: SB2040:EXT_UART
interpolate: false
#run_current: 0.65
run_current: 0.672
#run_current: 0.400
#hold_current: 0.1
sense_resistor: 0.110
stealthchop_threshold: 0
driver_TBL: 0
driver_TOFF: 3
driver_HSTRT: 7
driver_HEND: 6
[adxl345]
cs_pin: SB2040:ADXL
spi_software_sclk_pin: SB2040:gpio0
spi_software_mosi_pin: SB2040:gpio3
spi_software_miso_pin: SB2040:gpio2

[resonance_tester]
probe_points: 125, 125, 200
accel_chip: adxl345

[probe]
pin: ^SB2040:LIMIT_1
x_offset: 0
y_offset: 0
z_offset: -1.095
#speed: 15.0
speed: 3.0
samples: 5
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.01
samples_tolerance_retries: 7
activate_gcode:
    {% set PROBE_TEMP = 150 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}

    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M106 S255
        M109 S{ PROBE_TEMP }
        M106 S0
    {% else %}
        # Temperature target is already low enough, but nozzle may still be too hot.
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
    {% endif %}
