# This file contains common pin mappings for the BIGTREETECH ex-extruder
# Canbus board. To use this config, the firmware should be compiled for the
#RP2040
#16KiB bootloader
#CAN bus (on 1/0)
#CAN bus speed 1000000
# See docs/Config_Reference.md for a description of parameters.
#
#                                    
#                                    
#                               
#                       ----------            
#             -y       |          |              
#              ^       |          |           
#              |        ----------                     
#              |       *                    
#    +x <------*        
#              |    
#              |    
#             +y        x,z,-y
#                   
#
[board_pins extruder]
mcu: extruder
aliases:
aliases_2209:
    EXT_EN=gpio14,EXT_STEP=gpio7,EXT_DIR=gpio6,EXT_UART=gpio15
aliases_endstop:
    LIMIT_0=gpio16, LIMIT_1=gpio20
aliases_probe: 
    PROBE_0=gpio22
aliases_cnc_fans:
    FAN0=gpio21,FAN1=gpio13
aliases_thermistors:
    TH0=gpio27,MAX31865=gpio17
aliases_heaters:
    HE0=gpio23
aliases_rgb:
    RGBLED=gpio26
aliases_adxl:
    ADXL=gpio12
aliases_spi1:
    SCLK1=gpio2,MOSI1=gpio3,MISO1=gpio4
aliases_blt:
    BLT_C=gpio24