# This file contains common pin mappings for the BIGTREETECH ex-extruder
# Canbus board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB0/PB1)".
# The "EBB Can" micro-controller will be used to control the components on the nozzle.
#STM32G0B1
#8KiB bootloader
#8 MHz crystal
#CAN bus (on PB0/PB1)
#CAN bus speed 1000000
# See docs/Config_Reference.md for a description of parameters.
#
#                                    
#                                    
#                               
#                       ----------            
#             -y       |          |              
#              ^       |          |           
#              |        ----------                     
#              |       *                    
#    +x <------*        
#              |    
#              |    
#             +y        x,z,-y
#                   
#
[board_pins extruder]
mcu: extruder
aliases:
aliases_2209:
    EXT_EN=PD2,EXT_STEP=PD0,EXT_DIR=PD1,EXT_UART=PA15,EXT_DIAG=PB6
aliases_endstop:
    LIMIT_0=PB6, LIMIT_1=PB5
aliases_probe: 
    PROBE_0=PB7
aliases_cnc_fans:
    FAN0=PA0,FAN1=PA1
#aliases_tahometer:
#    TAH0=PB15
aliases_thermistors:
    TH0=PA3,PT100=PA4,TC0=PA2,MAX31865=PA4
aliases_heaters:
    HE0=PB13
aliases_rgb:
    RGBLED=PD3
aliases_adxl:
    ADXL=PB12
aliases_spi1:
    SCLK1=PA5,MOSI1=PA7,MISO1=PA6
aliases_spi2:
    SCLK2=PB10,MOSI2=PB11,MISO2=PB2
aliases_blt:
    BLT_S=PB8,BLT_C=PB9
 
[mcu extruder]
#serial: /dev/serial/by-id/usb-Klipper_Klipper_firmware_12345-if00
canbus_uuid: 6d2fdc845601

#[temperature_sensor TC0]
#sensor_type: Generic 3950
#sensor_pin: extruder: TC0

[adxl345]
cs_pin: extruder: ADXL
#spi_bus: spi2
spi_software_sclk_pin: extruder: SCLK2
spi_software_mosi_pin: extruder: MOSI2
spi_software_miso_pin: extruder: MISO2
axes_map: x,z,-y
#   The accelerometer axis for each of the printer's X, Y, and Z axes.
#   This may be useful if the accelerometer is mounted in an
#   orientation that does not match the printer orientation. For
#   example, one could set this to "y, x, z" to swap the X and Y axes.
#   It is also possible to negate an axis if the accelerometer
#   direction is reversed (eg, "x, z, -y"). The default is "x, y, z".

#[resonance_tester]
#probe_points: 175, 175, 150
#accel_chip: adxl345

