[gcode_macro FILAMENT_LOAD_UNLOAD]
description: Загрузка/выгрузка филамента с проверкой сенсоров и состояния принтера
variable_load_extra: 100.0
variable_unload_extra: 150.0
variable_extrude_check_length: 30.0
variable_load_speed: 50.0
variable_unload_speed: 100.0
variable_max_load_length: 500.0
variable_max_unload_length: 500.0
variable_max_initial_load_length: 150.0
variable_encoder_check: True
variable_min_temp: 170.0
gcode:
    # Проверка состояния принтера
    {% set printer_state = printer.idle_timeout.state %}
    {% set is_paused = printer.pause_resume.is_paused if 'pause_resume' in printer else False %}
    
    {% if printer_state != "Idle" and printer_state != "Ready" and not is_paused %}
        { action_respond_info("Ошибка: Операции с филаментом разрешены только в режиме паузы, простоя или готовности!") }
        M300 S440 P500
        G4 P1000
        M300 S440 P500
    {% else %}
        {% set min_temp = printer["gcode_macro FILAMENT_LOAD_UNLOAD"].min_temp %}
        {% set current_temp = printer.extruder.temperature %}
        {% set target_temp = printer.extruder.target %}
        
        # Проверка температуры
        {% if current_temp < min_temp %}
            { action_respond_info("Нагрев сопла до " + min_temp|string + "°C...") }
            M109 S{min_temp}
        {% elif target_temp < min_temp %}
            { action_respond_info("Установка температуры сопла до " + min_temp|string + "°C...") }
            M109 S{min_temp}
        {% endif %}
        
        {% set load_extra = printer["gcode_macro FILAMENT_LOAD_UNLOAD"].load_extra %}
        {% set unload_extra = printer["gcode_macro FILAMENT_LOAD_UNLOAD"].unload_extra %}
        {% set extrude_check_length = printer["gcode_macro FILAMENT_LOAD_UNLOAD"].extrude_check_length %}
        {% set load_speed = printer["gcode_macro FILAMENT_LOAD_UNLOAD"].load_speed %}
        {% set unload_speed = printer["gcode_macro FILAMENT_LOAD_UNLOAD"].unload_speed %}
        {% set max_load_length = printer["gcode_macro FILAMENT_LOAD_UNLOAD"].max_load_length %}
        {% set max_unload_length = printer["gcode_macro FILAMENT_LOAD_UNLOAD"].max_unload_length %}
        {% set max_initial_load_length = printer["gcode_macro FILAMENT_LOAD_UNLOAD"].max_initial_load_length %}
        {% set encoder_check = printer["gcode_macro FILAMENT_LOAD_UNLOAD"].encoder_check %}
        
        {% set switch_sensor = printer['filament_switch_sensor switch_sensor'].filament_detected if 'filament_switch_sensor switch_sensor' in printer else False %}
        {% set extruder_sensor = printer['filament_switch_sensor extruder_sensor'].filament_detected if 'filament_switch_sensor extruder_sensor' in printer else False %}
        {% set encoder_sensor = printer['filament_motion_sensor encoder_sensor'].filament_detected if 'filament_motion_sensor encoder_sensor' in printer and encoder_check else True %}
        
        {% if not encoder_sensor %}
            { action_respond_info("Ошибка: Encoder Sensor не обнаруживает движение!") }
            M300 S440 P500
            G4 P1000
            M300 S440 P500
            G4 P1000
            M300 S440 P500
            UPDATE_DELAYED_GCODE ID=_encoder_error_stop DURATION=0.1
        {% else %}
            
            {% if switch_sensor and extruder_sensor %}
                # Оба сенсора показывают наличие филамента - выгрузка
                { action_respond_info("Начинаю выгрузку филамента...") }
                SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT VARIABLE=stage VALUE='"extrude"'
                SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT VARIABLE=unloaded_length VALUE=0.0
                SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT VARIABLE=length VALUE={extrude_check_length}
                SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT VARIABLE=unload_extra VALUE={unload_extra}
                SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT VARIABLE=speed VALUE={unload_speed}
                SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT VARIABLE=max_length VALUE={max_unload_length}
                UPDATE_DELAYED_GCODE ID=_unload_filament_loop DURATION=0.1
                
            {% elif switch_sensor and not extruder_sensor %}
                # Switch Sensor есть, Extruder Sensor нет - загрузка до срабатывания Extruder Sensor
                { action_respond_info("Начинаю загрузку филамента до срабатывания Extruder Sensor...") }
                SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT VARIABLE=stage VALUE='"load_to_extruder"'
                SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT VARIABLE=loaded_length VALUE=0.0
                SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT VARIABLE=load_extra VALUE={load_extra}
                SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT VARIABLE=speed VALUE={load_speed}
                SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT VARIABLE=max_length VALUE={max_load_length}
                SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT VARIABLE=max_initial_load_length VALUE={max_initial_load_length}
                UPDATE_DELAYED_GCODE ID=_load_filament_loop DURATION=0.1
                
            {% elif not switch_sensor and not extruder_sensor %}
                # Оба сенсора показывают отсутствие филамента - загрузка до срабатывания Switch Sensor
                { action_respond_info("Филамент не обнаружен, начинаю загрузку до срабатывания Switch Sensor...") }
                SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT VARIABLE=stage VALUE='"load_to_switch"'
                SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT VARIABLE=loaded_length VALUE=0.0
                SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT VARIABLE=load_extra VALUE={load_extra}
                SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT VARIABLE=speed VALUE={load_speed}
                SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT VARIABLE=max_length VALUE={max_load_length}
                SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT VARIABLE=max_initial_load_length VALUE={max_initial_load_length}
                UPDATE_DELAYED_GCODE ID=_load_filament_loop DURATION=0.1
                
            {% elif not switch_sensor and extruder_sensor %}
                # Switch Sensor нет, Extruder Sensor есть - загрузка до срабатывания Switch Sensor
                { action_respond_info("Начинаю загрузку филамента до срабатывания Switch Sensor...") }
                SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT VARIABLE=stage VALUE='"load_to_switch"'
                SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT VARIABLE=loaded_length VALUE=0.0
                SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT VARIABLE=load_extra VALUE={load_extra}
                SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT VARIABLE=speed VALUE={load_speed}
                SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT VARIABLE=max_length VALUE={max_load_length}
                SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT VARIABLE=max_initial_load_length VALUE={max_initial_load_length}
                UPDATE_DELAYED_GCODE ID=_load_filament_loop DURATION=0.1
                
            {% else %}
                # Нестандартная ситуация
                { action_respond_info("Нестандартная ситуация с сенсорами, проверьте оборудование") }
            {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro _LOAD_FILAMENT]
description: Внутренний макрос для загрузки филамента
variable_stage: "load_to_switch"
variable_loaded_length: 0.0
variable_load_extra: 0.0
variable_speed: 0.0
variable_max_length: 0.0
variable_max_initial_load_length: 0.0
gcode:
    # Эта функция будет вызываться через delayed gcode
    # Реальная логика в _load_filament_loop

[gcode_macro _UNLOAD_FILAMENT]
description: Внутренний макрос для выгрузки филамента
variable_stage: "extrude"
variable_unloaded_length: 0.0
variable_length: 0.0
variable_unload_extra: 0.0
variable_speed: 0.0
variable_max_length: 0.0
gcode:
    # Эта функция будет вызываться через delayed gcode
    # Реальная логика в _unload_filament_loop

[delayed_gcode _load_filament_loop]
gcode:
    # Проверка состояния принтера (расширена для учета нагрева)
    {% set printer_state = printer.idle_timeout.state %}
    {% set is_paused = printer.pause_resume.is_paused if 'pause_resume' in printer else False %}
    
    {% if printer_state != "Idle" and printer_state != "Ready" and printer_state != "Printing" and not is_paused %}
        { action_respond_info("Ошибка: Принтер вышел из разрешенного состояния во время загрузки!") }
        M300 S440 P500
        {% else %}
        {% set stage = printer["gcode_macro _LOAD_FILAMENT"].stage %}
        {% set loaded_length = printer["gcode_macro _LOAD_FILAMENT"].loaded_length %}
        {% set load_extra = printer["gcode_macro _LOAD_FILAMENT"].load_extra %}
        {% set speed = printer["gcode_macro _LOAD_FILAMENT"].speed %}
        {% set max_length = printer["gcode_macro _LOAD_FILAMENT"].max_length %}
        {% set max_initial_load_length = printer["gcode_macro _LOAD_FILAMENT"].max_initial_load_length %}
        
        {% set switch_sensor_name = 'filament_switch_sensor switch_sensor' %}
        {% set extruder_sensor_name = 'filament_switch_sensor extruder_sensor' %}
        
        {% if stage == "load_to_switch" %}
            # Загрузка до срабатывания Switch Sensor (без проверки Encoder Sensor)
            {% if switch_sensor_name in printer and printer[switch_sensor_name].filament_detected %}
                # Switch Sensor сработал, переходим к дополнительной загрузке
                { action_respond_info("Switch Sensor сработал, продолжаю загрузку...") }
                SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT VARIABLE=stage VALUE='"load_extra"'
                UPDATE_DELAYED_GCODE ID=_load_filament_loop DURATION=0.1
            {% elif loaded_length >= max_initial_load_length %}
                { action_respond_info("Ошибка: Превышена максимальная длина начальной загрузки (150мм)!") }
                M300 S440 P1000
            {% else %}
                # Продолжаем загрузку до Switch Sensor
                SAVE_GCODE_STATE NAME=loading_state
                G91
                G1 E10 F{speed * 60}
                G90
                RESTORE_GCODE_STATE NAME=loading_state
                
                {% set new_length = loaded_length + 10.0 %}
                SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT VARIABLE=loaded_length VALUE={new_length}
                UPDATE_DELAYED_GCODE ID=_load_filament_loop DURATION=0.1
            {% endif %}
            
        {% elif stage == "load_to_extruder" %}
            # Загрузка до срабатывания Extruder Sensor (с проверкой Encoder Sensor)
            {% if extruder_sensor_name in printer and printer[extruder_sensor_name].filament_detected %}
                # Extruder Sensor сработал, переходим к дополнительной загрузке
                { action_respond_info("Extruder Sensor сработал, продолжаю загрузку...") }
                SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT VARIABLE=stage VALUE='"load_extra"'
                UPDATE_DELAYED_GCODE ID=_load_filament_loop DURATION=0.1
            {% elif loaded_length >= max_length %}
                { action_respond_info("Ошибка: Превышена максимальная длина загрузки!") }
                M300 S440 P1000
            {% else %}
                # Продолжаем загрузку до Extruder Sensor
                SAVE_GCODE_STATE NAME=loading_state
                G91
                G1 E10 F{speed * 60}
                G90
                RESTORE_GCODE_STATE NAME=loading_state
                
                {% set new_length = loaded_length + 10.0 %}
                SET_GCODE_VARIABLE MACRO=_LOAD_FILAMENT VARIABLE=loaded_length VALUE={new_length}
                
                # Проверка Encoder Sensor
                {% if 'filament_motion_sensor encoder_sensor' in printer %}
                    {% if not printer['filament_motion_sensor encoder_sensor'].filament_detected %}
                        { action_respond_info("Ошибка: Нет движения филамента при загрузке!") }
                        M300 S440 P500
                    {% else %}
                        UPDATE_DELAYED_GCODE ID=_load_filament_loop DURATION=0.1
                    {% endif %}
                {% else %}
                    UPDATE_DELAYED_GCODE ID=_load_filament_loop DURATION=0.1
                {% endif %}
            {% endif %}
            
        {% elif stage == "load_extra" %}
            # Дополнительная загрузка
            SAVE_GCODE_STATE NAME=loading_state
            G91
            G1 E{load_extra} F{speed * 60}
            G90
            
            # Финальная проверка Encoder Sensor (только если был процесс с проверкой)
            {% if 'filament_motion_sensor encoder_sensor' in printer and (printer["gcode_macro _LOAD_FILAMENT"].stage == "load_to_extruder") %}
                {% if not printer['filament_motion_sensor encoder_sensor'].filament_detected %}
                    { action_respond_info("Ошибка: Нет движения филамента при дополнительной загрузке!") }
                    M300 S440 P500
                {% endif %}
            {% endif %}
            
            RESTORE_GCODE_STATE NAME=loading_state
            { action_respond_info("Загрузка филамента завершена") }
        {% endif %}
    {% endif %}

[delayed_gcode _unload_filament_loop]
gcode:
    # Проверка состояния принтера (расширена для учета нагрева)
    {% set printer_state = printer.idle_timeout.state %}
    {% set is_paused = printer.pause_resume.is_paused if 'pause_resume' in printer else False %}
    
    {% if printer_state != "Idle" and printer_state != "Ready" and printer_state != "Printing" and not is_paused %}
        { action_respond_info("Ошибка: Принтер вышел из разрешенного состояния во время выгрузки!") }
        M300 S440 P500
        {% else %}
        {% set stage = printer["gcode_macro _UNLOAD_FILAMENT"].stage %}
        {% set unloaded_length = printer["gcode_macro _UNLOAD_FILAMENT"].unloaded_length %}
        {% set length = printer["gcode_macro _UNLOAD_FILAMENT"].length %}
        {% set unload_extra = printer["gcode_macro _UNLOAD_FILAMENT"].unload_extra %}
        {% set speed = printer["gcode_macro _UNLOAD_FILAMENT"].speed %}
        {% set max_length = printer["gcode_macro _UNLOAD_FILAMENT"].max_length %}
        
        {% set switch_sensor_name = 'filament_switch_sensor switch_sensor' %}
        
        {% if stage == "extrude" %}
            # Начальное экструдирование
            SAVE_GCODE_STATE NAME=unloading_state
            G91
            G1 E{length} F{speed * 60}
            G90
            
            # Проверка Encoder Sensor после начального экструдирования
            {% if 'filament_motion_sensor encoder_sensor' in printer %}
                {% if not printer['filament_motion_sensor encoder_sensor'].filament_detected %}
                    { action_respond_info("Ошибка: Нет движения филамента при начальном экструдировании!") }
                    M300 S440 P500
                    RESTORE_GCODE_STATE NAME=unloading_state
                {% else %}
                    RESTORE_GCODE_STATE NAME=unloading_state
                    SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT VARIABLE=stage VALUE='"unload"'
                    UPDATE_DELAYED_GCODE ID=_unload_filament_loop DURATION=0.1
                {% endif %}
            {% else %}
                RESTORE_GCODE_STATE NAME=unloading_state
                SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT VARIABLE=stage VALUE='"unload"'
                UPDATE_DELAYED_GCODE ID=_unload_filament_loop DURATION=0.1
            {% endif %}
            
        {% elif stage == "unload" %}
            {% if switch_sensor_name in printer and printer[switch_sensor_name].filament_detected and unloaded_length < max_length %}
                # Продолжаем выгрузку
                SAVE_GCODE_STATE NAME=unloading_state
                G91
                G1 E-10 F{speed * 60}
                G90
                RESTORE_GCODE_STATE NAME=unloading_state
                
                {% set new_length = unloaded_length + 10.0 %}
                SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT VARIABLE=unloaded_length VALUE={new_length}
                
                # Проверка Encoder Sensor
                {% if 'filament_motion_sensor encoder_sensor' in printer %}
                    {% if not printer['filament_motion_sensor encoder_sensor'].filament_detected %}
                        { action_respond_info("Ошибка: Нет движения филамента при выгрузке!") }
                        M300 S440 P500
                    {% else %}
                        UPDATE_DELAYED_GCODE ID=_unload_filament_loop DURATION=0.1
                    {% endif %}
                {% else %}
                    UPDATE_DELAYED_GCODE ID=_unload_filament_loop DURATION=0.1
                {% endif %}
                
            {% elif unloaded_length >= max_length %}
                { action_respond_info("Ошибка: Превышена максимальная длина выгрузки!") }
                M300 S440 P1000
            {% elif switch_sensor_name in printer and not printer[switch_sensor_name].filament_detected %}
                # Сенсор не сработал, переходим к дополнительной выгрузке
                SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT VARIABLE=stage VALUE='"extra_unload"'
                UPDATE_DELAYED_GCODE ID=_unload_filament_loop DURATION=0.1
            {% else %}
                UPDATE_DELAYED_GCODE ID=_unload_filament_loop DURATION=0.1
            {% endif %}
            
        {% elif stage == "extra_unload" %}
            # Дополнительная выгрузка
            SAVE_GCODE_STATE NAME=unloading_state
            G91
            G1 E-{unload_extra} F{speed * 60}
            G90
            
            # Финальная проверка Encoder Sensor
            {% if 'filament_motion_sensor encoder_sensor' in printer %}
                {% if not printer['filament_motion_sensor encoder_sensor'].filament_detected %}
                    { action_respond_info("Ошибка: Нет движения филамента при дополнительной выгрузке!") }
                    M300 S440 P500
                {% endif %}
            {% endif %}
            
            RESTORE_GCODE_STATE NAME=unloading_state
            { action_respond_info("Выгрузка филамента завершена") }
        {% endif %}
    {% endif %}

[gcode_macro BUTTON_FILAMENT_ACTION]
description: Макрос для вызова по кнопке
gcode:
    FILAMENT_LOAD_UNLOAD

[delayed_gcode _encoder_error_stop]
gcode:
    { action_respond_info("Процесс остановлен из-за ошибки Encoder Sensor") }