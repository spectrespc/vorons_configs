[gcode_button my_filament_unload_button]
# Замените pin на реальный пин, к которому подключена ваша кнопка.
# Пример для кнопки, замыкающей на землю, с подтяжкой:
pin: ^!linux:gpiochip0/gpio23
# press_gcode выполняется при нажатии кнопки
press_gcode:
    # Получаем переменные из макроса настроек
    {% set unload_settings = printer["gcode_macro _UNLOAD_FILAMENT_SETTINGS"] %}
    {% set unload_length = unload_settings.unload_length_mm | float %}
    {% set unload_speed = unload_settings.unload_speed_mms | float %}
    {% set min_temp = unload_settings.min_extruder_temp | int %}

    {% if printer.idle_timeout.state != "Printing" %}
        # Проверяем температуру напрямую, так как can_extrude может использовать другое значение
        {% if printer.extruder.temperature >= min_temp %}
            # Передаем параметры в макрос шага
            SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT_STEP VARIABLE=run VALUE=True
            SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT_STEP VARIABLE=step_length VALUE={unload_length}
            SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT_STEP VARIABLE=step_speed VALUE={unload_speed}
            _UNLOAD_FILAMENT_STEP
        {% else %}
            { action_respond_info("Экструдер недостаточно горячий для извлечения (%.1fC). Минимум: %dC" % (printer.extruder.temperature, min_temp)) }
        {% endif %}
    {% else %}
        { action_respond_info("Невозможно извлечь филамент во время печати") }
    {% endif %}
# release_gcode выполняется при отпускании кнопки
release_gcode:
   # Останавливаем процесс извлечения
   SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT_STEP VARIABLE=run VALUE=False
   { action_respond_info("Извлечение филамента остановлено") }


[gcode_macro _UNLOAD_FILAMENT_SETTINGS]
description: Настройки для процесса извлечения филамента
variable_unload_length_mm: 1.0     # Длина шага извлечения в мм
variable_unload_speed_mms: 5.0      # Скорость извлечения в мм/с
variable_min_extruder_temp: 170     # Минимальная температура экструдера для извлечения в °C
variable_step_interval_sec: 0.1     # Интервал между шагами в секундах (100мс)
gcode:
    # Этот макрос существует только для хранения переменных.
    # Вы можете использовать его в других макросах для получения этих значений.
    # Например: {% set settings = printer["gcode_macro _UNLOAD_FILAMENT_SETTINGS"] %}
    #           {% set speed = settings.unload_speed_mms %}
    RESPOND PREFIX="info" MSG="Настройки извлечения: Шаг={unload_length_mm}мм, Скорость={unload_speed_mms}мм/с, Мин.Темп={min_extruder_temp}°C, Интервал={step_interval_sec}с"


[gcode_macro _UNLOAD_FILAMENT_STEP]
description: Макрос для одного шага извлечения и запуска следующего шага
variable_run: False
variable_step_length: 1.0
variable_step_speed: 5.0
# Примечание: step_speed хранится в мм/с, а G1 требует мм/мин (F значение)
gcode:
    {% set settings = printer["gcode_macro _UNLOAD_FILAMENT_SETTINGS"] %}
    {% set interval_sec = settings.step_interval_sec | float %}

    {% if run == true %}
        {% if printer.idle_timeout.state != "Printing" and printer.extruder.temperature >= settings.min_extruder_temp %}
            # Выполняем один шаг извлечения
            M83 ; Относительная экструзия
            # Преобразуем мм/с в мм/мин для параметра F
            G1 E{-step_length} F{step_speed * 60} ; Извлекаем step_length мм со скоростью step_speed мм/с
            M400 ; Ждем завершения этого движения

            # Рекурсивно планируем следующий шаг
            UPDATE_DELAYED_GCODE ID=_UNLOAD_FILAMENT_DELAYED DURATION={interval_sec}
        {% else %}
            # Если условия больше не соблюдены, останавливаем
            SET_GCODE_VARIABLE MACRO=_UNLOAD_FILAMENT_STEP VARIABLE=run VALUE=False
            { action_respond_info("Извлечение остановлено: Печать началась или температура упала ниже %d°C" % settings.min_extruder_temp) }
        {% endif %}
    {% endif %}


[delayed_gcode _UNLOAD_FILAMENT_DELAYED]
gcode:
    # Этот отложенный макрос просто вызывает основной макрос шага
    _UNLOAD_FILAMENT_STEP
