# TEST_KINEMATICS: final smoke test after a TEST_SPEED run.  Homed axes are
# checked first, then the toolhead sweeps the bed with a diagonal vibration
# pattern at the current max_velocity (a +/-30% sweep around the bed centre).
# Noise, a visible wobble or a skipped step here means the pair found by
# TEST_SPEED still needs a margin.
#
# Source: gist alienboyxp/194649a9314f8adfceb51ae8b2e80b7b
# (macros_config_test_kinematics.cfg, v_20240401), reproduced with the
# original comments trimmed and no logic changes.
#
# The pattern stays inside the bed because every coordinate is built from
# axis_maximum/2 and the factors are 1 +/- i/100 with i < 30.  Run it cold or
# at printing temperature; it does not heat anything.

[gcode_macro TEST_KINEMATICS]
description: Test Printer Kinematics
gcode:
    # home not homed axies
    {% for axis in ['x', 'y', 'z'] %}
        {% if axis not in printer.toolhead.homed_axes %}
            G28 { axis }
        {% endif %}
    {% endfor %}

    # move bed down 3 cm at max speed
    G0 Z30 F1000

    # move head to center of bed at max speed
    G0 X{ printer.toolhead.axis_maximum.x / 2 } Y{ printer.toolhead.axis_maximum.y / 2 } F{ printer.toolhead.max_velocity * 60 }

    # Vibrate max speed +/- 30% of min-min to max-max
    {% for i in range(30) %}
        G0 X{ ( printer.toolhead.axis_maximum.x / 2 ) * ( 1 + i / 100.0 ) } Y{ ( printer.toolhead.axis_maximum.y / 2 ) * ( 1 + i / 100.0 ) } F{ printer.toolhead.max_velocity * 60 }
        G0 X{ ( printer.toolhead.axis_maximum.x / 2 ) * ( 1 - i / 100.0 ) } Y{ ( printer.toolhead.axis_maximum.y / 2 ) * ( 1 - i / 100.0 ) } F{ printer.toolhead.max_velocity * 60 }
    {% endfor %}

    # move head to center of bed at max speed
    G0 X{ printer.toolhead.axis_maximum.x / 2 } Y{ printer.toolhead.axis_maximum.y / 2 } F{ printer.toolhead.max_velocity * 60 }

    # Vibrate max speed +/- 30% of max-min to min-max
    {% for i in range(30) %}
        G0 X{ ( printer.toolhead.axis_maximum.x / 2 ) * ( 1 - i / 100.0 ) } Y{ ( printer.toolhead.axis_maximum.y / 2 ) * ( 1 + i / 100.0 ) } F{ printer.toolhead.max_velocity * 60 }
        G0 X{ ( printer.toolhead.axis_maximum.x / 2 ) * ( 1 + i / 100.0 ) } Y{ ( printer.toolhead.axis_maximum.y / 2 ) * ( 1 - i / 100.0 ) } F{ printer.toolhead.max_velocity * 60 }
    {% endfor %}

    # move head to center of bed at max speed
    G0 X{ printer.toolhead.axis_maximum.x / 2 } Y{ printer.toolhead.axis_maximum.y / 2 } F{ printer.toolhead.max_velocity * 60 }