# Probe-temperature guard for machines whose Z probe is mounted on the
# toolhead (v24 and the trident family): the nozzle must not be hotter than
# 150C while Z is homed or the gantry is levelled.  A hot nozzle softens the
# part it touches, oozes onto the bed and shifts the probe trigger point through
# thermal expansion, so G28 (when it homes Z) and QUAD_GANTRY_LEVEL are wrapped.
#
# Included by profile.cfg for the v24 model; the wrappers rename the existing
# commands on klippy:connect, so G28.1 still goes through [safe_z_home] (30 mm
# gantry lift, probe at the bed centre) and QUAD_GANTRY_LEVEL_BASE through the
# [quad_gantry_level] module.
#
# QUAD_GANTRY_LEVEL is two passes on eddy machines.  The rear part of the v24
# gantry is heavier, sags on the belts, and a single pass at the section
# tolerance can take minutes or never converge.  A scan pass over such a skew
# is also unsafe: it runs at an absolute Z and the eddy sensor reports an
# out-of-range error only after the toolhead has already moved to the next
# point.  So a bare call levels with the descend method first (probing stops
# descend_z above the bed, so the skew cannot be pushed into it), probes the
# absolute bed height, and only then scans with the height derived from that
# measurement.  A call with any parameter stays a single pass with the
# parameters passed through unchanged.
#
# BED_MESH_CALIBRATE is deliberately not wrapped: a mesh is normally taken at
# print temperature.

[gcode_macro _PROBE_TEMP_GUARD]
description: Cool the nozzle below 150C before any probing move
gcode:
    {% set MAX_TEMP = 150 %}
    {% set WAIT_TEMP = MAX_TEMP + 5 %}
    {% set target = printer.extruder.target|float %}
    {% set actual = printer.extruder.temperature|float %}
    {% if target > MAX_TEMP %}
        { action_respond_info("Probe guard: extruder target %.0fC is too high, lowering to %dC" % (target, MAX_TEMP)) }
        M104 S{MAX_TEMP}
        M109 S{MAX_TEMP}
    {% elif actual > WAIT_TEMP %}
        { action_respond_info("Probe guard: extruder at %.0fC, waiting until below %dC" % (actual, WAIT_TEMP)) }
        TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={WAIT_TEMP}
    {% endif %}

# Home with the guard active only when Z is part of the request: a bare G28 or
# G28 Z waits for <= 150C, while G28 X Y (or G28 Y) skips it, so PRINT_END and
# CANCEL_PRINT are not delayed.
[gcode_macro G28]
description: Home, cooling the nozzle first when Z is homed
rename_existing: G28.1
gcode:
    {% set homes_z = 'Z' in params or ('X' not in params and 'Y' not in params) %}
    {% if homes_z %}
        _PROBE_TEMP_GUARD
    {% endif %}
    G28.1 {rawparams}

[gcode_macro QUAD_GANTRY_LEVEL]
description: Level the gantry, cooling the nozzle first
rename_existing: QUAD_GANTRY_LEVEL_BASE
gcode:
    _PROBE_TEMP_GUARD
    {% if params %}
        # Explicit request: single pass, parameters passed through unchanged.
        QUAD_GANTRY_LEVEL_BASE {rawparams}
    {% elif printer.probe is not defined
             or 'probe_eddy_current' not in printer.probe.name %}
        # A physical [probe] has no scan mode: keep the single descend pass.
        QUAD_GANTRY_LEVEL_BASE
    {% else %}
        # Rough pass: descend probing stops descend_z above the bed, so a
        # sagged rear corner cannot be pushed into it.  Verified to 0.25 mm.
        { action_respond_info("QGL rough pass: descend, tolerance 0.25 mm") }
        QUAD_GANTRY_LEVEL_BASE RETRY_TOLERANCE=0.25 RETRIES=2
        # Absolute reference of the bed surface, measured after levelling.
        _QGL_ZERO_PROBE
        _QGL_FINE
    {% endif %}

# The zero probe and the scan pass must be separate macros: a gcode_macro
# template is rendered in full before its G-code runs, so a scan height derived
# from the PROBE result inside the same body would use the previous value.
[gcode_macro _QGL_ZERO_PROBE]
description: Probe the bed surface height at the mesh zero reference point
gcode:
    {% set settings = printer.configfile.settings %}
    {% set mesh = settings.bed_mesh %}
    {% if mesh is defined and mesh.zero_reference_position is defined
          and mesh.zero_reference_position is not none %}
        {% set ref = mesh.zero_reference_position %}
    {% else %}
        {% set ref = [ (printer.toolhead.axis_minimum.x + printer.toolhead.axis_maximum.x) / 2,
                        (printer.toolhead.axis_minimum.y + printer.toolhead.axis_maximum.y) / 2 ] %}
    {% endif %}
    G90
    G1 Z10.0 F600
    G1 X{ref[0]|float} Y{ref[1]|float} F6000
    PROBE
    # PROBE with SAMPLES=1 does not retract, so lift before returning.
    G1 Z10.0 F600

[gcode_macro _QGL_FINE]
description: Precise gantry level using the eddy scan method
gcode:
    {% set MAX_ZERO_DEV = params.MAX_ZERO_DEV|default(0.5)|float %}
    {% set probe_name = printer.probe.name %}
    {% set probe_cfg = printer.configfile.settings[probe_name] %}
    # descend_z is the current option; z_offset is its deprecated alias.
    {% if probe_cfg.descend_z is defined %}
        {% set descend_z = probe_cfg.descend_z|float %}
    {% else %}
        {% set descend_z = probe_cfg.z_offset|float %}
    {% endif %}
    {% set bed_z = printer.probe.last_probe_position.z|float %}
    {% if descend_z <= 0 %}
        { action_raise_error(
              "QGL fine pass aborted: no usable descend_z/z_offset in [%s]."
              % probe_name) }
    {% endif %}
    {% if bed_z|abs > MAX_ZERO_DEV %}
        { action_raise_error(
              "QGL fine pass aborted: bed surface measured at Z=%.3f, expected "
              "0 +/- %.2f mm. Re-run Z_ENDSTOP_CALIBRATE and "
              "Z_OFFSET_APPLY_PROBE." % (bed_z, MAX_ZERO_DEV)) }
    {% endif %}
    {% if bed_z|abs > 0.05 %}
        { action_respond_info("QGL: bed surface at Z=%.3f mm, target 0.00" % bed_z) }
    {% endif %}
    # Scanning at bed_z + descend_z keeps the gap exactly descend_z whatever
    # the absolute zero is, so the scan cannot run into the bed.
    { action_respond_info("QGL fine pass: scan at Z=%.3f (%.3f mm gap)"
                          % (bed_z + descend_z, descend_z)) }
    QUAD_GANTRY_LEVEL_BASE METHOD=scan HORIZONTAL_MOVE_Z={ (bed_z + descend_z)|round(3) }