# TEST_SPEED_Z: move Z up and down at a given speed and compare the MCU step
# counters of every Z stepper.  A difference above one full step means a skipped
# step; a difference between the Z motors is a skew and must abort the run.
#
# This macro deliberately does NOT home, level or change the TMC registers:
# homing re-bases the MCU counters, so the clean differential signal is only
# available while the gantry stays homed.  The Python runner (scripts/tmc_tune.py
# --z-test) does G28 + leveling before every candidate, applies the TMC settings
# again after the restart and parses the two GET_POSITION answers.
#
# Parameters:
#   SPEED       mm/s of the Z moves; refused above [printer] max_z_velocity,
#               because Klipper would clamp it and the run would be a false pass
#   ACCEL       mm/s^2, logged only: Klipper has no runtime setter for max_z_accel
#   ITERATIONS  number of up/down pairs (each pair travels TRAVEL in total)
#   Z0          centre of the window, mm
#   TRAVEL      full up/down amplitude, mm (half of it each way)
#   FLOOR       lowest Z the macro may reach, mm (nozzle safety)

[gcode_macro TEST_SPEED_Z]
description: Move Z at SPEED/ACCEL and compare the MCU positions of all Z steppers

gcode:
    {% set speed = params.SPEED|default(15)|float %}
    {% set accel = params.ACCEL|default(printer.configfile.settings.printer.max_z_accel)|float %}
    {% set iterations = params.ITERATIONS|default(5)|int %}
    {% set travel = params.TRAVEL|default(20)|float %}
    {% set floor = params.FLOOR|default(40)|float %}
    {% set z_max = printer.toolhead.axis_maximum.z|float %}
    {% set z0 = params.Z0|default((floor + 20)|float)|float %}

    # Guards: a refused run must never move the gantry.
    {% if "z" not in printer.toolhead.homed_axes %}
        { action_raise_error("TEST_SPEED_Z: Z is not homed, run G28 first") }
    {% endif %}
    {% if z0 - travel / 2 < floor %}
        { action_raise_error("TEST_SPEED_Z: Z0=%.1f minus TRAVEL/2=%.1f is below FLOOR=%.1f" % (z0, travel / 2, floor)) }
    {% endif %}
    {% if z0 + travel / 2 > z_max - 5 %}
        { action_raise_error("TEST_SPEED_Z: Z0=%.1f plus TRAVEL/2=%.1f exceeds axis_maximum.z-5=%.1f" % (z0, travel / 2, z_max - 5)) }
    {% endif %}
    {% if speed > printer.configfile.settings.printer.max_z_velocity|float %}
        { action_raise_error("TEST_SPEED_Z: SPEED=%.1f is above max_z_velocity=%s: Klipper clamps the move, so the run would be a false pass. Raise max_z_velocity in the profile first." % (speed, printer.configfile.settings.printer.max_z_velocity)) }
    {% endif %}

    SAVE_GCODE_STATE NAME=TEST_SPEED_Z
    G90
    { action_respond_info("TEST_SPEED_Z: %d iterations, %.1f mm/s, max_z_accel %.0f, Z0=%.1f, TRAVEL=%.1f" % (iterations, speed, accel, z0, travel)) }

    # Approach and settle before the first counter read.
    G1 Z{z0} F{15 * 60}
    M400
    GET_POSITION

    {% for i in range(iterations) %}
        G1 Z{z0 + travel / 2} F{speed * 60}
        G1 Z{z0 - travel / 2} F{speed * 60}
    {% endfor %}

    # Return to the start height, settle, and read the counters again.
    G1 Z{z0} F{speed * 60}
    M400
    GET_POSITION
    RESTORE_GCODE_STATE NAME=TEST_SPEED_Z