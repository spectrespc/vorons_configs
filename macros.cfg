[gcode_macro PRINT_START]
#   Use PRINT_START for the slicer starting script - please customise for your slicer of choice
gcode:
    #BED_MESH_CLEAR
    #CURENT_HOME_Z
    G28
    #Z_TILT_ADJUST
    #CLEAN_NOZZLE
    #CURENT_RUN_Z
    Z_TILT_ADJUST
    G28 Z

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    G91
    G0 F6000 Z2
    G90
    G92 E0                         ; zero the extruder
    G1 E-5.0 F3600                ; retract filament
    G91                            ; relative positioning
    G28 X Y
    M106 S0
    #TURN_OFF_HEATERS
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0
    CLEAR_PAUSE
    RESTORE_DEFAULT_SETTING
    SDCARD_RESET_FILE
    BASE_CANCEL_PRINT


[gcode_macro M105]
rename_existing:            M105.1
gcode:  

   M105.1

   #if the extruder is off
   {% if printer.extruder.target == 0 %}

      #Set the LED to red if the extruder is off but is still hot, otherwise 
      # set the color to green
      {% if printer.extruder.temperature > 60.0 %}
         SET_LED LED=fysetc_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=1  TRANSMIT=0
         SET_LED LED=fysetc_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=2  TRANSMIT=1
      {% else %}
         SET_LED LED=fysetc_mini12864 RED=0 GREEN=1 BLUE=0 INDEX=1  TRANSMIT=0
         SET_LED LED=fysetc_mini12864 RED=0 GREEN=1 BLUE=0 INDEX=2  TRANSMIT=1
      {% endif %}     

   {% else %}

         #if the extruder temp is at target temperature 
         {% if printer.extruder.temperature >= printer.extruder.target - 4.0 %}
            SET_LED LED=fysetc_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=1  TRANSMIT=0
            SET_LED LED=fysetc_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=2  TRANSMIT=1
         #if the extruder is still heating
         {% else %}
            {% set scaler = printer.extruder.temperature|float / printer.extruder.target|float %}
            SET_LED LED=fysetc_mini12864 RED={ scaler|float * 1 } GREEN=0 BLUE=0 INDEX=1  TRANSMIT=0
            SET_LED LED=fysetc_mini12864 RED={ scaler|float * 1 } GREEN=0 BLUE=0 INDEX=2  TRANSMIT=1
         {% endif %}  

   {% endif %}

[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script
gcode:
    #   Get Boundaries
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    
    #   Check end position to determine safe directions to move
    M400                           ; wait for buffer to clear
    G91                            ; relative positioning
    G1 X-2 Y-2 E-4 F300
    # Raise nozzle by 10mm
    G1 Z10 F3000
    G28 Y
    M107                           ; turn off fan
    G90                            ; absolute positioning
    BED_MESH_CLEAR
    #RESTORE_GCODE_STATE NAME=STATE_PRINT_END
    SET_LED LED=fysetc_mini12864 RED=0 GREEN=1 BLUE=0 INDEX=1 TRANSMIT=0
    SET_LED LED=fysetc_mini12864 RED=0 GREEN=1 BLUE=0 INDEX=2 TRANSMIT=0
    SET_LED LED=fysetc_mini12864 RED=0 GREEN=0.5 BLUE=0 INDEX=3 
    RESTORE_DEFAULT_SETTING
    M117 Finished!

[gcode_macro RESTORE_DEFAULT_SETTING]
gcode:
    {% set _PA = printer.configfile.settings.extruder.pressure_advance|float %}
    {% set _PAST = printer.configfile.settings.extruder.pressure_advance_smooth_time|float %}
    {% set _MA = printer.configfile.settings.printer.max_accel|float %}
    SET_PRESSURE_ADVANCE ADVANCE={ _PA }
    SET_PRESSURE_ADVANCE SMOOTH_TIME={ _PAST }
    SET_VELOCITY_LIMIT ACCEL={ _MA }