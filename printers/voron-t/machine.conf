# Оси и фичи профиля voron-t. Читает scripts/render_profile.py.
# Полное описание ключей: docs/PROFILES.md.
size=150
model=trident

# Механика: archetype trident = CoreXY, 3 мотора Z, выравнивание z_tilt.
kinematics=corexy
z_count=3
leveling=z_tilt

board=manta-m5p
# Шаг X/Y-моторов сверяется со step_angle_deg мотора в docs/tmc/motors.json.
xy_step=0.9
xy_motor=17HM19-1684
xy_driver=tmc5160

# Z-пара: драйвер tmc2109 (на плате M5P) + мотор 17HS4401S.
z_motor=17HS4401S
z_driver=tmc2109

# Драйвер экструдера задан платой toolhead (sht36-v3 — tmc2209).
e_motor=MOONS-CSE14HRA1L410A-01
toolhead=sht36-v3
head=HGX.8T

# Рейлы питания: X/Y от vm_xy, Z и экструдеры от vm_ze (всегда 24 В).
# M5P питает драйверы от входа 24 В, поэтому 48 В — максимум для vm_xy.
vm_xy=48
vm_ze=24

# Входы расчёта чоппера SpreadCycle (TBL/TOFF), см. docs/tmc/CALCS.md §3.
# Парковые значения: все оси 0/3.
xy_tbl=0
xy_toff=3
z_tbl=0
z_toff=3
e_tbl=0
e_toff=3

# Внешние габариты рамы для проверок геометрии.
frame_w=310
frame_d=310

# Измеренная геометрия стола (2026-11-08): база передней стойки 227 мм,
# левая нога (передняя левая -> задняя) 245 мм. Сверяется с anchors.cfg.
z_base_measured=227
z_leg_measured=245

# Дополнительные модули в фиксированном порядке рендера.
features=belay,runout,btt_sfs,extra_extruder,fans,display,buttons,host,y_frame
