# voron-t machine axes and features. Read by scripts/render_profile.py.
# Every value here changes the generated profile.cfg.
size=150
model=trident
board=manta-m5p
xy_step=0.9
toolhead=sht36-v3
head=HGX.8T

# Physical frame outside dimensions, used by the geometry sanity checks.
frame_w=310
frame_d=310

# Measured bed pivot geometry (2026-11-08): front screw base 227 mm,
# left leg (front-left -> rear) 245 mm. Checked against anchors.cfg.
z_base_measured=227
z_leg_measured=245

# Optional modules, in the fixed order the renderer emits them.
features=belay,runout,btt_sfs,extra_extruder,fans,display,buttons,host,y_frame