# voron-t measured anchors. Managed file: deploy overwrites it from the repo.
#
# замер 2026-11-08: база передних винтов 227 мм, левая сторона треугольника
# 245 мм (перед-лево -> зад), стол 150x150, рама 310x310x400.
# Для z_tilt значима только относительная геометрия: общий сдвиг тройки
# компенсируется G28 Z.
#
# TODO(2026-11-08): правая сторона треугольника не измерена, ожидание ~245 мм;
# пересчитать, если расхождение больше 2 мм.
# TODO(2026-11-08): max_z 105 и limits 153/156 унаследованы от масштаба 0.6x250,
# подтвердить по физическим упорам (step E14 плана).
[stepper_x]
position_endstop: 153
position_max: 153

[stepper_y]
position_endstop: 156
position_max: 156

[stepper_z]
position_max: 105

[z_tilt]
z_positions:
    -38.5, 18
    75, 235.1
    188.5, 18
points:
    15, 45
    75, 135
    135, 45

[safe_z_home]
home_xy_position: 75, 135
speed: 50.0
z_hop: 15
z_hop_speed: 15.0

[bed_mesh]
# Was 125, 235: Y is outside the 156 mm travel, which made
# BED_MESH_CALIBRATE fail with "Move out of range".
zero_reference_position: 75, 135