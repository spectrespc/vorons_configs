# Seed manifest for the voron-t Klipper profile.
#
# This file is partially managed: deploy_configs.sh replaces everything above
# the SAVE_CONFIG marker from the repository profile on every deploy and keeps
# the marker with the autosave block below it, so the calibrated values below it
# are the only machine-local runtime state that is not in git.
#
# The include list itself is generated from machine.conf into profile.cfg.
[include profile.cfg]

# Runtime overrides (UUIDs, PID, input shaper, extruder calibration) come last.
[include std.config.local/*.cfg]