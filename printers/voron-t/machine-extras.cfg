# Machine-specific overrides that do not fit the shared catalogs.
# voron-t: idle timeout references this machine's display LED and fans.
[idle_timeout]
timeout: 1200
gcode:
    M83
    TURN_OFF_HEATERS
    M84
    SET_LED LED=fysetc_mini12864 RED=0.1 GREEN=0 BLUE=0
    SET_FAN_SPEED FAN=filter_fan SPEED=0
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0