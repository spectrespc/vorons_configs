# Оси и фичи профиля v24-350. Читает scripts/render_profile.py.
# Полное описание ключей: docs/PROFILES.md.
# Измеренные anchors заполняются в anchors.cfg после ввода в строй.
size=350
model=v24

# Механика: archetype v24 = CoreXY, 4 мотора Z, quad_gantry_level.
kinematics=corexy
z_count=4
leveling=quad_gantry_level

board=manta-m8p
# Шаг X/Y-моторов сверяется со step_angle_deg мотора в docs/tmc/motors.json.
xy_step=1.8
xy_motor=LDO-42STH48-2804AC
xy_driver=tmc5160

# Z-пара: драйвер tmc2209 + мотор 17HS4401S.
z_motor=17HS4401S
z_driver=tmc2209

# Драйвер экструдера задан платой toolhead (sht36-v3 — tmc2209).
e_motor=MOONS-CSE14HRA1L410A-01
toolhead=sht36-v3
head=HGX.8T

# Рейлы питания: X/Y от vm_xy, Z и экструдеры от vm_ze (всегда 24 В).
# 55 В допустимы только на M8P V2.0 (HV-вход драйверов 24–60 В).
vm_xy=55
vm_ze=24

# Входы расчёта чоппера SpreadCycle (TBL/TOFF), см. docs/tmc/CALCS.md §3.
# Парковые значения: все оси 0/3.
xy_tbl=0
xy_toff=3
z_tbl=0
z_toff=3
e_tbl=0
e_toff=3

frame_w=510
frame_d=510
features=belay,runout,btt_sfs,extra_extruder,fans,display,buttons,host,y_frame,eddy_f
