# Machine-specific overrides that do not fit the shared catalogs.
[idle_timeout]
timeout: 1800

# Z drivers on this harness are seated contiguously in MOTOR3..MOTOR6 instead of
# the reference MOTOR3/5/6/7 pattern:
#   Z0 = MOTOR3, Z1 = MOTOR4, Z2 = MOTOR5, Z3 = MOTOR6.
# Verified over UART on 2026-11-15: all four TMC2209 answer (PB9, PB5, PG14,
# PG10); MOTOR7 is empty and stays silent, so the catalog map is the
# reference only and must be overridden per machine.
# Rotation direction: the reference corner pattern (Z0=DIR_2, Z1=!DIR_3,
# Z2=DIR_4, Z3=!DIR_5).  An earlier all-four inversion made the +30 mm
# safe_z_home hop move the gantry down, so it was reverted on 2026-11-15.
# Flipping every motor keeps the relative sign pattern of the mirror-mounted
# corners, so the QUAD_GANTRY_LEVEL tilt behaviour does not change; only the
# absolute up/down direction flips. Confirmation is a small +Z move and then
# G28 Z on the bench.
[stepper_z]
step_pin: STEP_2
dir_pin: DIR_2
enable_pin: !EN_2
# Hybrid Z homing on the bench: G28 Z parks on the M3-STOP switch (SENS_2),
# while QUAD_GANTRY_LEVEL and BED_MESH_CALIBRATE probe with the eddy sensor
# ([probe_eddy_current fly_eddy_probe], see the address override below).
# Klipper's QGL is probe-only, so a switch cannot level the gantry.  descend_z
# 2.5 in the eddy module remains the safety stop of eddy probing.
# position_endstop is NOT set here: it is a per-machine value that
# Z_ENDSTOP_CALIBRATE + SAVE_CONFIG must be able to persist, and Klipper
# refuses that for an option living in an included file.  The boot placeholder
# and the calibrated value live in the profile's printer.cfg (seed).
endstop_pin: !SENS_2

[stepper_z1]
step_pin: STEP_3
dir_pin: !DIR_3
enable_pin: !EN_3

[stepper_z2]
step_pin: STEP_4
dir_pin: DIR_4
enable_pin: !EN_4

[stepper_z3]
step_pin: STEP_5
dir_pin: !DIR_5
enable_pin: !EN_5

[tmc2209 stepper_z1]
uart_pin: UART_3

[tmc2209 stepper_z2]
uart_pin: UART_4

[tmc2209 stepper_z3]
uart_pin: UART_5

# The LDC1612 on this toolhead answers at I2C address 43 (the built-in SHT36
# Max V3 chip), not at 42 (the external FLY-EDDY-F default of the shared
# eddy_f module): on 2026-11-18 addr 42 reported "START_READ_NACK" and aborted
# Klipper, while addr 43 answered and LDC_CALIBRATE_DRIVE_CURRENT returned
# reg_drive_current 15.  The address is strapped in hardware, so it is a
# machine fact and belongs here, not in std.configs.
#
# Probe offsets, Klipper convention: offset = probe position - nozzle
# position (manual_probe reports bed_x = test_x + x_offset, and
# ProbePointsHelper moves the nozzle to point - offset).  Operator measurement
# on 2026-11-21: the coil centre sits 33 mm behind the nozzle, so y_offset: 33
# reports the bed point under the coil.  x_offset: 0 is the symmetric
# assumption and must be confirmed by the same PROBE run (README, "Probe
# offset: sign, one-command check, consequences").  Klipper applies these
# offsets only in bed_mesh; quad_gantry_level/z_tilt move by `points` as nozzle
# positions, so anchors.cfg already stores (bed point - offset) there.
[probe_eddy_current fly_eddy_probe]
i2c_address: 43
x_offset: 0
y_offset: 33

# Measured X/Y speed envelope (bench v24-350, 2026-11-22, cold machine).
# Method: TEST_SPEED from std.macros/test_speed.cfg (AndrewEllis93 guide) with
# ITERATIONS=1 over speed 700/800/900 mm/s and accel 3000..10000 mm/s^2 in
# 1000 steps; the two GET_POSITION MCU counters are compared after a re-home.
# A delta above one full step (0.2 mm at every microstep setting) means skipped
# steps, so "tested" below lists the highest cell where no run exceeded that,
# and "recommended" is that cell minus ~15 % margin.
#
# microsteps | tested without loss | recommended      | recommended     | max
#            | (speed / accel)    | max_velocity     | max_accel       | dev.
# -----------+--------------------+------------------+-----------------+--------
#     32     |    900 / 6000      |       750        |      5000       | 0.22 mm*
#     64     |    900 / 10000     |       750        |      8500       | 0.17 mm
#    128     |    900 / 10000     |       750        |      8500       | 0.08 mm
#
# * 32 microsteps was the previous default and is not monotonic: 700/10000
#   loses ~0.8 mm on X and Y reproducibly (motor A), 800-900/10000 and
#   900/9000 lose ~0.4 mm in single runs, and 1000/3000 always loses.  At 64
#   and 128 microsteps the whole 700-900 / 3000-10000 grid passed; 128 leaves
#   the largest margin to the one-full-step threshold, so extra headroom is
#   expected there but speeds above 900 mm/s were not tested.
#
# Step rate: 64 microsteps is 320 steps/mm, 128 microsteps is 640 steps/mm, so
# 900 mm/s needs 288 kHz and 576 kHz.  The Manta M8P handled both.  X/Y now
# default to microsteps: 64 in std.configs/mechanics/v24.cfg (the tested row
# above); 128 needs an explicit [stepper_x]/[stepper_y] microsteps override
# plus a Klipper restart.  The [printer] section there now applies the
# 64-microstep recommendation (750 / 8500); the 32 and 128 rows stay as
# reference, not as applied settings.  QGL, bed_mesh and PRINT_START keep
# their own speeds.
#
# Full-step switch by speed (THIGH / VHIGHFS / VHIGHCHM), bench 2026-11-22:
# the mechanism exists and works - SET_TMC_FIELD FIELD=thigh VELOCITY=500
# gives THIGH=19 on both axes, driver_VHIGHFS/CHM=1 appear in CHOPCONF, and
# 9 of 11 DRV_STATUS samples taken during 438 mm diagonals at 750 mm/s
# reported fsactive=1 while all 11 standstill samples reported fsactive=0.
# It is NOT applied: the point of the switch is to fix a measurable failure,
# and baseline A (thigh=0, both bits 0) already passed 750/8500, 900/9000 and
# 900/10000 with 3/3 clean runs at microsteps 64 (|delta| <= 35 MCU counts,
# one full step is 64).  Candidate B (CHM only, thigh=13 -> 700 mm/s) was
# equally clean, 9/9, |delta| <= 31.  Candidate C (FS+CHM) produced two clean
# runs before the toolhead MCU 'extruder' stopped answering on CAN (klippy
# logged a canstat burst - 6288 rx errors and 6333 tx retries within one
# second - then Timeout on connect) and Klipper shut down; the bus and the
# USB-CAN bridge stayed alive (nodeid 4 / nodeid 6 kept exchanging frames).
# Root cause found on 2026-11-22: the CAN/power connector on the SHT36 came
# loose during the high-speed runs; after re-seating it the board is back and
# the C/D series was repeated: C (FS+CHM) 9/9 clean, |delta| <= 10; D (FS
# only) 9/9 with |delta| <= 11 except one 750/8500 run that showed +515 on one
# motor - the same rare ~8-full-step event seen in baseline, with no CAN error
# in that run's window.  Since the gate requires a baseline failure that the
# candidate removes, stage 2 stops here: keep microsteps 64 without VHIGH.
# One-off anomaly worth remembering: in the first six runs of the series
# (right after the mechanism test) A at 750/8500 and 900/9000 showed
# +498..+773 counts on one motor, and the same +512..+773 pattern never
# reappeared in 12 later runs or in three dedicated diagnostics that split
# the drift between the pattern and the final G28.
# Retry note: INIT_TMC does not restore vhighfs/vhighchm (the current module
# has no config key for them, so Klipper writes the runtime values back);
# only a Klipper restart clears hand-set bits.
#
# High-speed extension above the 900 mm/s envelope (2026-11-22, same bench,
# microsteps 64, ITERATIONS=1, 3 repeats per cell, A = baseline, D = full
# step with thigh=13 -> 700 mm/s).  Counts are the absolute GET_POSITION
# deltas after a re-home; one full step is 64 counts:
#   cell          A (counts)        D (counts)       note
#   1000 / 8500   9, 13, 10         7, 10, 7         clean
#   1100 / 8500   11, 253, 1        8, 7, 268        one 4-step event each
#   1200 / 8500   16, 8, 7          11, 7, 6         clean
#   1100 / 10000  511, 511, 508     509, 766, 765    8 full steps, 3/3 both
# Full step does not help: both variants are clean up to 1200 mm/s at accel
# 8500 and both lose ~8 full steps at 1100/10000 (D is equal or worse).  A
# follow-up diagnostic parked at Z=30 on both sides of the run (TEST_SPEED
# parks at the homed Z, i.e. at the bed): the pattern delta is 0/0 while the
# drift appears only after the final full G28, so the homing reference shifts
# after a 1100/10000 run (gantry/belt slip) - the motion path itself keeps its
# steps.  LOST_STEPS stayed 0 in all 24 runs.  1200 mm/s at 320 steps/mm is
# 384 kHz per motor and was handled; 1100/10000 is where the mechanics gives
# up.  The applied envelope therefore stays 750/8500 with a large margin.
#
# Applied-limit +50 % series (2026-11-23, baseline A only: thigh=0, both VHIGH
# bits 0, no driver_THIGH/high_velocity_threshold options, microsteps 64,
# ITERATIONS=1, 3 repeats per cell).  +50 % of the applied [printer] 750/8500
# is 1125 mm/s and 12750 mm/s^2.  Counts are the GET_POSITION deltas across
# TEST_SPEED (one full step is 64 counts; pass <= 32, repeat <= 64):
#   cell          dx / dy per repeat          result
#   1000 / 12750  -22/28, -6/-238, -5/-247    2/3 fail
#   1125 /  8500  -3/9, 5/3, 3/-503           1/3 fail
#   1125 / 10000  5/-257, -1/-505, 0/-252     3/3 fail
#   1125 / 12750  3/5, 1/7, 0/6               3/3 pass
# The +50 % accel point 1125/12750 itself is clean, and the failures are not
# monotonic in accel: 1125/10000 fails 3/3 while 1125/12750 passes 3/3.  A
# diag4 run (pattern vs re-home, Z=30 park on both sides) on the failing cells
# reported pattern 0/0 every time and re-home -519/-511 (1000/12750), +520/0
# (1125/8500), -514/-7 (1125/10000): the ~8-full-step (512 counts) shift is
# the homing reference moving after the run, not a pattern step loss.  This
# continues the 2026-11-22 finding at 1100/10000.  LOST_STEPS stayed 0 in all
# 12 runs, TMC temperature was 54.9-56.0 C, and the CAN toolhead MCU stayed
# bus_state=active with rx_error=0 and tx_error=0; only the cumulative
# tx_retries grew (123 at series start, 283 after the matrix, no timeout).
# Conclusion: keep 750/8500.  The mechanics does not hold a monotonic +50 %
# envelope, and raising the [printer] defaults stays a separate decision.
