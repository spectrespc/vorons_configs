# Machine-specific overrides that do not fit the shared catalogs.
[idle_timeout]
timeout: 1800

# Z drivers on this harness are seated contiguously in MOTOR3..MOTOR6 instead of
# the reference MOTOR3/5/6/7 pattern:
#   Z0 = MOTOR3, Z1 = MOTOR4, Z2 = MOTOR5, Z3 = MOTOR6.
# Verified over UART on 2026-11-15: all four TMC2209 answer (PB9, PB5, PG14,
# PG10); MOTOR7 is empty and stays silent, so the catalog map is the
# reference only and must be overridden per machine.
# Rotation direction: the reference corner pattern (Z0=DIR_2, Z1=!DIR_3,
# Z2=DIR_4, Z3=!DIR_5).  An earlier all-four inversion made the +30 mm
# safe_z_home hop move the gantry down, so it was reverted on 2026-11-15.
# Flipping every motor keeps the relative sign pattern of the mirror-mounted
# corners, so the QUAD_GANTRY_LEVEL tilt behaviour does not change; only the
# absolute up/down direction flips. Confirmation is a small +Z move and then
# G28 Z on the bench.
[stepper_z]
step_pin: STEP_2
dir_pin: DIR_2
enable_pin: !EN_2
# Hybrid Z homing on the bench: G28 Z parks on the M3-STOP switch (SENS_2),
# while QUAD_GANTRY_LEVEL and BED_MESH_CALIBRATE probe with the eddy sensor
# ([probe_eddy_current fly_eddy_probe], see the address override below).
# Klipper's QGL is probe-only, so a switch cannot level the gantry.  descend_z
# 2.5 in the eddy module remains the safety stop of eddy probing.
# position_endstop is a calibrated machine fact and lives here, not in the
# autosave: SAVE_CONFIG refuses to persist an option that is already present in
# an included file ("SAVE_CONFIG section 'stepper_z' option 'position_endstop'
# conflicts with included value"), and this file is an include.  Re-tuning the
# Z mechanics means pasting the new value printed by Z_ENDSTOP_CALIBRATE (or
# read from configfile.save_config_pending_items) here and deploying again.
# 2026-11-18: the switch triggered 0.430 mm above the paper when this value
# was measured.
endstop_pin: !SENS_2
position_endstop: -0.030

[stepper_z1]
step_pin: STEP_3
dir_pin: !DIR_3
enable_pin: !EN_3

[stepper_z2]
step_pin: STEP_4
dir_pin: DIR_4
enable_pin: !EN_4

[stepper_z3]
step_pin: STEP_5
dir_pin: !DIR_5
enable_pin: !EN_5

[tmc2209 stepper_z1]
uart_pin: UART_3

[tmc2209 stepper_z2]
uart_pin: UART_4

[tmc2209 stepper_z3]
uart_pin: UART_5

# The LDC1612 on this toolhead answers at I2C address 43 (the built-in SHT36
# Max V3 chip), not at 42 (the external FLY-EDDY-F default of the shared
# eddy_f module): on 2026-11-18 addr 42 reported "START_READ_NACK" and aborted
# Klipper, while addr 43 answered and LDC_CALIBRATE_DRIVE_CURRENT returned
# reg_drive_current 15.  The address is strapped in hardware, so it is a
# machine fact and belongs here, not in std.configs.
[probe_eddy_current fly_eddy_probe]
i2c_address: 43
