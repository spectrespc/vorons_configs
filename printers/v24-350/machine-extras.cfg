# Machine-specific overrides that do not fit the shared catalogs.
[idle_timeout]
timeout: 1800

# Z drivers on this harness are seated contiguously in MOTOR3..MOTOR6 instead of
# the reference MOTOR3/5/6/7 pattern:
#   Z0 = MOTOR3, Z1 = MOTOR4, Z2 = MOTOR5, Z3 = MOTOR6.
# Verified over UART on 2026-11-15: all four TMC2209 answer (PB9, PB5, PG14,
# PG10); MOTOR7 is empty and stays silent, so the catalog map is the
# reference only and must be overridden per machine.
# Rotation direction: all four Z motors are inverted on 2026-11-15 relative to
# the reference corner pattern, because the bench needs the opposite polarity
# with this slot wiring. Flipping every motor keeps the relative sign pattern
# of the mirror-mounted corners, so the QUAD_GANTRY_LEVEL tilt behaviour does
# not change; only the absolute up/down direction flips. Final confirmation is
# a G28 Z and QUAD_GANTRY_LEVEL run on the bench.
[stepper_z]
step_pin: STEP_2
dir_pin: !DIR_2
enable_pin: !EN_2

[stepper_z1]
step_pin: STEP_3
dir_pin: DIR_3
enable_pin: !EN_3

[stepper_z2]
step_pin: STEP_4
dir_pin: !DIR_4
enable_pin: !EN_4

[stepper_z3]
step_pin: STEP_5
dir_pin: DIR_5
enable_pin: !EN_5

[tmc2209 stepper_z1]
uart_pin: UART_3

[tmc2209 stepper_z2]
uart_pin: UART_4

[tmc2209 stepper_z3]
uart_pin: UART_5
