# Machine-specific overrides that do not fit the shared catalogs.
[idle_timeout]
timeout: 1800

# Z drivers on this harness are seated contiguously in MOTOR3..MOTOR6 instead of
# the reference MOTOR3/5/6/7 pattern:
#   Z0 = MOTOR3, Z1 = MOTOR4, Z2 = MOTOR5, Z3 = MOTOR6.
# Verified over UART on 2026-11-15: all four TMC2209 answer (PB9, PB5, PG14,
# PG10); MOTOR7 is empty and stays silent, so the catalog map is the
# reference only and must be overridden per machine.
# Rotation direction: the reference corner pattern (Z0=DIR_2, Z1=!DIR_3,
# Z2=DIR_4, Z3=!DIR_5).  An earlier all-four inversion made the +30 mm
# safe_z_home hop move the gantry down, so it was reverted on 2026-11-15.
# Flipping every motor keeps the relative sign pattern of the mirror-mounted
# corners, so the QUAD_GANTRY_LEVEL tilt behaviour does not change; only the
# absolute up/down direction flips. Confirmation is a small +Z move and then
# G28 Z on the bench.
[stepper_z]
step_pin: STEP_2
dir_pin: DIR_2
enable_pin: !EN_2
# Hybrid Z homing on the bench: G28 Z parks on the M3-STOP switch (SENS_2),
# while QUAD_GANTRY_LEVEL and BED_MESH_CALIBRATE probe with the eddy sensor
# ([probe_eddy_current fly_eddy_probe], see the address override below).
# Klipper's QGL is probe-only, so a switch cannot level the gantry.  descend_z
# 2.5 in the eddy module remains the safety stop of eddy probing.
# position_endstop is NOT set here: it is a per-machine value that
# Z_ENDSTOP_CALIBRATE + SAVE_CONFIG must be able to persist, and Klipper
# refuses that for an option living in an included file.  The boot placeholder
# and the calibrated value live in the profile's printer.cfg (seed).
endstop_pin: !SENS_2

[stepper_z1]
step_pin: STEP_3
dir_pin: !DIR_3
enable_pin: !EN_3

[stepper_z2]
step_pin: STEP_4
dir_pin: DIR_4
enable_pin: !EN_4

[stepper_z3]
step_pin: STEP_5
dir_pin: !DIR_5
enable_pin: !EN_5

[tmc2209 stepper_z1]
uart_pin: UART_3

[tmc2209 stepper_z2]
uart_pin: UART_4

[tmc2209 stepper_z3]
uart_pin: UART_5

# The LDC1612 on this toolhead answers at I2C address 43 (the built-in SHT36
# Max V3 chip), not at 42 (the external FLY-EDDY-F default of the shared
# eddy_f module): on 2026-11-18 addr 42 reported "START_READ_NACK" and aborted
# Klipper, while addr 43 answered and LDC_CALIBRATE_DRIVE_CURRENT returned
# reg_drive_current 15.  The address is strapped in hardware, so it is a
# machine fact and belongs here, not in std.configs.
#
# Probe offsets, Klipper convention: offset = probe position - nozzle
# position (manual_probe reports bed_x = test_x + x_offset, and
# ProbePointsHelper moves the nozzle to point - offset).  Operator measurement
# on 2026-11-21: the coil centre sits 33 mm behind the nozzle, so y_offset: 33
# reports the bed point under the coil.  x_offset: 0 is the symmetric
# assumption and must be confirmed by the same PROBE run (README, "Probe
# offset: sign, one-command check, consequences").  Klipper applies these
# offsets only in bed_mesh; quad_gantry_level/z_tilt move by `points` as nozzle
# positions, so anchors.cfg already stores (bed point - offset) there.
[probe_eddy_current fly_eddy_probe]
i2c_address: 43
x_offset: 0
y_offset: 33

# Measured X/Y speed envelope (bench v24-350, 2026-11-22, cold machine).
# Method: TEST_SPEED from std.macros/test_speed.cfg (AndrewEllis93 guide) with
# ITERATIONS=1 over speed 700/800/900 mm/s and accel 3000..10000 mm/s^2 in
# 1000 steps; the two GET_POSITION MCU counters are compared after a re-home.
# A delta above one full step (0.2 mm at every microstep setting) means skipped
# steps, so "tested" below lists the highest cell where no run exceeded that,
# and "recommended" is that cell minus ~15 % margin.
#
# microsteps | tested without loss | recommended      | recommended     | max
#            | (speed / accel)    | max_velocity     | max_accel       | dev.
# -----------+--------------------+------------------+-----------------+--------
#     32     |    900 / 6000      |       750        |      5000       | 0.22 mm*
#     64     |    900 / 10000     |       750        |      8500       | 0.17 mm
#    128     |    900 / 10000     |       750        |      8500       | 0.08 mm
#
# * 32 microsteps was the previous default and is not monotonic: 700/10000
#   loses ~0.8 mm on X and Y reproducibly (motor A), 800-900/10000 and
#   900/9000 lose ~0.4 mm in single runs, and 1000/3000 always loses.  At 64
#   and 128 microsteps the whole 700-900 / 3000-10000 grid passed; 128 leaves
#   the largest margin to the one-full-step threshold, so extra headroom is
#   expected there but speeds above 900 mm/s were not tested.
#
# Step rate: 64 microsteps is 320 steps/mm, 128 microsteps is 640 steps/mm, so
# 900 mm/s needs 288 kHz and 576 kHz.  The Manta M8P handled both.  X/Y now
# default to microsteps: 64 in std.configs/mechanics/v24.cfg (the tested row
# above); 128 needs an explicit [stepper_x]/[stepper_y] microsteps override
# plus a Klipper restart.  The [printer] section there now applies the
# 64-microstep recommendation (750 / 8500); the 32 and 128 rows stay as
# reference, not as applied settings.  QGL, bed_mesh and PRINT_START keep
# their own speeds.
