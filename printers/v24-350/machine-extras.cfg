# Machine-specific overrides that do not fit the shared catalogs.
[idle_timeout]
timeout: 1800

# Z drivers on this harness are seated contiguously in MOTOR3..MOTOR6 instead of
# the reference MOTOR3/5/6/7 pattern:
#   Z0 = MOTOR3, Z1 = MOTOR4, Z2 = MOTOR5, Z3 = MOTOR6.
# Verified over UART on 2026-11-15: all four TMC2209 answer (PB9, PB5, PG14,
# PG10); MOTOR7 is empty and stays silent, so the catalog map is the
# reference only and must be overridden per machine.
# Rotation direction of the new slots is provisional: it follows the corner
# pattern of the reference map and is confirmed by QUAD_GANTRY_LEVEL.
[stepper_z1]
step_pin: STEP_3
dir_pin: !DIR_3
enable_pin: !EN_3

[stepper_z2]
step_pin: STEP_4
dir_pin: DIR_4
enable_pin: !EN_4

[stepper_z3]
step_pin: STEP_5
dir_pin: !DIR_5
enable_pin: !EN_5

[tmc2209 stepper_z1]
uart_pin: UART_3

[tmc2209 stepper_z2]
uart_pin: UART_4

[tmc2209 stepper_z3]
uart_pin: UART_5
