# Measured anchors for v24-350. Managed file: deploy overwrites it from git.
#
# замер 2026-11-15: центр стола 350x350 = 175,175 (расчёт от размера стола,
# не физический замер; якоря QGL по-прежнему TODO).
#
# TODO: measure the bed pivot points (gantry_corners, quad_gantry_level points)
# and the real travel limits, then put them here. safe_z_home and
# zero_reference_position are already pinned to the bed centre 175,175
# (geometry/v24-350.cfg carries the same value).
# Until then geometry/v24-350.cfg defaults apply.

# Z homing and Z=0 happen at the bed centre, like on the trident bench.
# v24 rule: G28 lifts the gantry 30 mm before homing X/Y (same value as
# geometry/v24-350.cfg), so a low or tilted gantry cannot drag the nozzle
# across the bed.
[safe_z_home]
home_xy_position: 175, 175
speed: 100.0
z_hop: 30
z_hop_speed: 30.0
