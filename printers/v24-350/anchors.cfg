# Measured anchors for v24-350. Managed file: deploy overwrites it from git.
#
# замер 2026-11-15: центр стола 350x350 = 175,175 (расчёт от размера стола,
# не физический замер; якоря QGL по-прежнему TODO).
#
# TODO: measure the bed pivot points (gantry_corners) and the real travel
# limits, then put them here.  The QGL points below are derived, not measured:
# the eddy coil centre sits 33 mm behind the nozzle (y_offset: 33 in
# machine-extras.cfg, measured 2026-11-21), and Klipper moves the nozzle by
# `points` as-is, so the values are written as (bed point - probe offset).
# When the real points are measured, report where the COIL lands and store
# them the same way, i.e. subtract x_offset/y_offset.  safe_z_home and
# zero_reference_position are already pinned to the bed centre 175,175
# (geometry/v24-350.cfg carries the same value).

# Coil positions on the bed: (50,60) (50,290) (300,290) (300,60).
# Nozzle = bed point - offset, so Y = 60 - 33 = 27 and Y = 290 - 33 = 257
# (x_offset is 0, X is unchanged).  The order 0..3 is kept from
# geometry/v24-350.cfg so the Z axes do not swap.
# Front edge: the coil cannot reach bed points with Y < 33, because the nozzle
# cannot go below position_min_y = 0.  That travel limit, not the bed edge,
# sets the front row of both the QGL anchors and the mesh.
[quad_gantry_level]
points:
    50, 27
    50, 257
    300, 257
    300, 27

# Largest reachable mesh with y_offset: 33.  Two independent limits, with P the
# bed point under the coil and the nozzle at P - offset:
#   travel: P_y >= position_min_y + y_offset = 33, P_y <= 383;
#   bed edge: P in [edge, 350 - edge], edge = 12 mm of coil still fully over the
#   conductive surface (a starting assumption, see README).
# Formula, with a 2 mm margin on the travel term only:
#   mesh_min = max(position_min + offset + 2, edge)
#   mesh_max = min(position_max + offset, bed - edge)
# X: max(0 + 0 + 2, 12) = 12, min(350, 338) = 338
# Y: max(0 + 33 + 2, 12) = 35, min(383, 338) = 338
# Consequence: P = (12,35) -> nozzle (12,2); P = (338,338) -> nozzle (338,305).
# 326 mm / 14 and 303 mm / 13 give ~23.3 mm per step, valid for bicubic.
# zero_reference_position stays 175,175 from geometry/v24-350.cfg: inside the
# mesh, and the safe_z_home / print-centre point.
[bed_mesh]
mesh_min: 12, 35
mesh_max: 338, 338
probe_count: 15, 14

# Z homing and Z=0 happen at the bed centre, like on the trident bench.
# v24 rule: G28 lifts the gantry 30 mm before homing X/Y (same value as
# geometry/v24-350.cfg), so a low or tilted gantry cannot drag the nozzle
# across the bed.
[safe_z_home]
home_xy_position: 175, 175
speed: 100.0
z_hop: 30
z_hop_speed: 30.0
