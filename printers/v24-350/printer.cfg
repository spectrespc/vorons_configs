# Seed manifest for this Klipper profile.
#
# This file is a SEED: deploy_configs.sh creates it only when it is missing and
# never overwrites it. Klipper's SAVE_CONFIG appends its autosave block here.
#
# The include list itself is generated from machine.conf into profile.cfg.
[include profile.cfg]

# Per-machine Z reference of the hybrid Z homing (the switch on !SENS_2).
# Klipper needs a value here to boot, so the seed ships a placeholder; a
# Z_ENDSTOP_CALIBRATE run followed by SAVE_CONFIG comments this line out and
# stores the calibrated value in the autosave block at the end of this file.
# It must stay in printer.cfg and not in machine-extras.cfg: SAVE_CONFIG cannot
# persist an option that an included file already sets ("conflicts with
# included value"). Value 0.400 is a placeholder, not a calibration.
[stepper_z]
position_endstop: 0.400

# Runtime overrides (UUIDs, PID, input shaper, extruder calibration) come last.
[include std.config.local/*.cfg]
